<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空气巴掌对决</title>
<!--
  Served by tools/web_dashboard.py; listens to /events (SSE), posts commands to /cmd.
  No external assets: works offline at the demo.

  Look: after ROSE & CAMELLIA (NIGORO) — a sepia Regency/Taisho mansion parlour, a rose-marked
  HP bar, white Mincho command text over an italic English line, ivory command tiles, Mincho
  name plates. The characters are original: two carved cameo profiles (Rose vs Camellia),
  not the game's art.

  System
    colour  umber #1b120c · wood #3a2718 · sepia #8a6a48 · parchment #efe4cc · gilt #c9a24b
            rose #a3122a (P1) · camellia blue #2b4a8f (P2)
    type    CJK serif (Songti / SimSun / Mincho) for everything Chinese; Palatino italic for English
    scale   command 8.5vw · plate 2.2vw · English line 1.7vw · small 1vw
    layout  HP halves + pocket watch on top · two cameos centre · plates + tiles bottom
-->
<style>
:root {
  --umber: #1b120c;
  --wood: #3a2718;
  --sepia: #8a6a48;
  --parch: #efe4cc;
  --ivory: #f7f0de;
  --gilt: #c9a24b;
  --gilt-hi: #ecd28b;
  --gilt-lo: #7a5a22;
  --rose: #a3122a;
  --rose-hi: #d9304a;
  --blue: #2b4a8f;
  --blue-hi: #5b7fd0;
  --ink: #120b08;
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", "NSimSun", "Yu Mincho", "MS Mincho", serif;
  --latin: "Palatino Linotype", "Book Antiqua", Palatino, "URW Palladio L", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--umber); color: var(--parch); font-family: var(--serif); }
body { user-select: none; }

/* ---------- the parlour ---------- */
#room { position: fixed; inset: 0; overflow: hidden;
  background:
    radial-gradient(ellipse 55% 60% at 50% 34%, rgba(255,214,150,.20), transparent 70%),
    linear-gradient(180deg, transparent 0 66%, rgba(0,0,0,.35) 66% 66.6%, rgba(255,220,170,.05) 66.6% 67.4%, rgba(0,0,0,.25) 67.4%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 .35vw, transparent .35vw 1.1vw, rgba(255,220,170,.05) 1.1vw 1.4vw, transparent 1.4vw 13vw),
    radial-gradient(ellipse 90% 80% at 50% 40%, #6a4a2e 0%, #3a2718 55%, #1b120c 100%);
}
#window { position: absolute; left: 50%; top: 9vh; width: 22vw; height: 50vh; transform: translateX(-50%);
  border-radius: 11vw 11vw 0 0; opacity: .5;
  background:
    linear-gradient(90deg, transparent 49.3%, rgba(40,25,15,.9) 49.3% 50.7%, transparent 50.7%),
    linear-gradient(0deg, transparent 32%, rgba(40,25,15,.9) 32% 33.5%, transparent 33.5% 65%, rgba(40,25,15,.9) 65% 66.5%, transparent 66.5%),
    radial-gradient(ellipse at 50% 30%, rgba(255,236,200,.55), rgba(190,150,100,.25) 60%, rgba(90,60,35,.1));
  box-shadow: 0 0 0 .6vw rgba(40,25,15,.85), 0 0 8vw rgba(255,214,150,.25);
}
.candle { position: absolute; width: 18vw; height: 18vw; margin: -9vw; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,200,120,.38), rgba(255,170,80,.08) 45%, transparent 70%);
  animation: flicker 3.7s infinite steps(1); mix-blend-mode: screen; }
.candle::after { content: ""; position: absolute; left: 50%; top: 50%; width: .5vw; height: 1.2vw; margin: -.9vw 0 0 -.25vw;
  border-radius: 50% 50% 45% 45%; background: radial-gradient(ellipse at 50% 70%, #fff8d8, #ffb648 60%, transparent 70%); }
@keyframes flicker { 0% { opacity: .9; } 17% { opacity: 1; } 31% { opacity: .82; } 52% { opacity: .97; } 68% { opacity: .86; } 85% { opacity: 1; } }
#grain { position: absolute; inset: -50%; opacity: .16; mix-blend-mode: overlay; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .6  0 0 0 0 .45  0 0 0 0 .3  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation: grain 1.2s steps(6) infinite; }
@keyframes grain { 0% { transform: translate(0,0); } 20% { transform: translate(-3%,2%); } 40% { transform: translate(2%,-3%); } 60% { transform: translate(-2%,-1%); } 80% { transform: translate(3%,3%); } }
#vignette { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 75% 70% at 50% 45%, transparent 55%, rgba(10,6,3,.78) 100%); }
#flash { position: fixed; inset: 0; background: #fff4dc; opacity: 0; pointer-events: none; z-index: 30; }
#slash { position: fixed; left: 0; top: 0; width: 40vw; height: 13vh; z-index: 23; pointer-events: none; opacity: 0; mix-blend-mode: multiply; }
#slash svg { width: 100%; height: 100%; overflow: visible; }

/* ---------- top: HP halves + pocket watch ---------- */
#hud { position: absolute; top: 3vh; left: 4vw; right: 4vw; z-index: 10;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1.2vw; }
.hp { position: relative; height: clamp(18px, 3.2vh, 34px); }
.hp .frame { position: absolute; inset: 0; border: 2px solid var(--gilt); outline: 1px solid var(--gilt-lo); outline-offset: 2px;
  background: linear-gradient(180deg, #120b08, #2a1b12); box-shadow: 0 0 0 4px rgba(18,11,8,.7), inset 0 2px 6px #000; }
.hp .trail, .hp .fill { position: absolute; top: 3px; bottom: 3px; width: calc(100% - 6px); }
.hp.p1 .trail, .hp.p1 .fill { right: 3px; }
.hp.p2 .trail, .hp.p2 .fill { left: 3px; }
.hp .trail { background: var(--parch); opacity: .85; transition: width .6s ease-in .55s; }
.hp .fill { transition: width .14s ease-out; }
.hp.p1 .fill { background: linear-gradient(180deg, #e8485e 0%, var(--rose) 45%, #5e0614 100%); }
.hp.p2 .fill { background: linear-gradient(180deg, #7b9be0 0%, var(--blue) 45%, #13244d 100%); }
.hp.low .fill { animation: low .7s ease-in-out infinite alternate; }
@keyframes low { to { filter: brightness(1.45) saturate(1.2); } }
.hp .emblem { position: absolute; top: 50%; width: clamp(34px, 4.6vh, 54px); aspect-ratio: 1; transform: translate(-50%, -50%);
  transition: left .14s ease-out; filter: drop-shadow(0 2px 2px rgba(0,0,0,.7)); }
.hp .emblem svg { width: 100%; height: 100%; }
.hpnum { position: absolute; top: calc(100% + .6vh); font: italic clamp(12px, 1.2vw, 20px)/1 var(--latin); color: var(--gilt-hi); letter-spacing: .08em; }
.hp.p1 .hpnum { left: 0; }
.hp.p2 .hpnum { right: 0; }

#watch { position: relative; width: clamp(70px, 7.4vw, 124px); aspect-ratio: 1; }
#watch svg { width: 100%; height: 100%; overflow: visible; }
#watch .arc { fill: none; stroke: var(--rose-hi); stroke-width: 5; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50px 50px; }
#watch.urgent .arc { stroke: #ff5a5a; }
#watchnum { position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  font: clamp(22px, 2.8vw, 46px)/1 var(--latin); color: var(--ink); }
#watch.idle #watchnum, #watch.judging #watchnum { font: clamp(11px, 1.05vw, 17px)/1.15 var(--serif); letter-spacing: .1em; }
#roundtag { position: absolute; left: 50%; top: calc(100% + .4vh); transform: translateX(-50%); white-space: nowrap;
  font: italic clamp(11px, 1.05vw, 17px)/1 var(--latin); letter-spacing: .25em; color: var(--gilt-hi); }

/* ---------- centre: cameos ---------- */
#stage { position: absolute; inset: 0; z-index: 5; }
.lady { position: absolute; top: 25vh; width: min(21vw, 42vh); aspect-ratio: 220 / 290; transform: translateX(-50%); }
#l0 { left: 27%; }
#l1 { left: 73%; }
.lady .sway { width: 100%; height: 100%; transform-origin: 50% 0; animation: sway 5s ease-in-out infinite; }
#l1 .sway { animation-delay: -2.5s; }
@keyframes sway { 50% { transform: rotate(.8deg); } }
.lady .cameo { width: 100%; height: 100%; transform-origin: 50% 8%; }
.lady svg.c { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 1.6vh 1.4vh rgba(0,0,0,.6)); }
.lady .print, .lady .crack, .lady .hurt { opacity: 0; }
.lady .print { transition: opacity 2s ease-in; }
.lady .print.show { opacity: .8; transition: none; }
.lady.ouch .hurt { opacity: 1; }
.lady.ouch .calm { opacity: 0; }
.lady.ko .crack { opacity: 1; }
.lady.ko .hurt { opacity: 1; }
.lady.ko .calm { opacity: 0; }
.lady.ko .cameo { transform: rotate(-9deg) translateY(3%); filter: grayscale(.7) brightness(.75); transition: transform .6s cubic-bezier(.3,1.6,.5,1), filter .8s; }
#l1.ko .cameo { transform: rotate(9deg) translateY(3%); }
.lady.glow svg.c { filter: drop-shadow(0 0 1.2vw rgba(255,214,120,.8)) drop-shadow(0 1.6vh 1.4vh rgba(0,0,0,.6)); }
.fan { position: absolute; left: 50%; top: 52%; width: 70%; aspect-ratio: 2 / 1.1; transform: translate(-50%, -50%) scale(0); opacity: 0; pointer-events: none; }
.fan svg { width: 100%; height: 100%; overflow: visible; }

.plate { position: absolute; top: calc(100% + 1.4vh); left: 50%; transform: translateX(-50%); text-align: center; white-space: nowrap; }
.plate .rank { font-size: clamp(11px, 1vw, 16px); letter-spacing: .3em; color: var(--sepia); }
.plate .name { display: flex; align-items: baseline; justify-content: center; gap: .5em; margin-top: .3vh;
  font-size: clamp(20px, 2.3vw, 40px); letter-spacing: .25em; color: var(--ivory); text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,.8); }
.plate .name i { font: italic clamp(12px, 1.15vw, 19px)/1 var(--latin); letter-spacing: .12em; color: var(--gilt-hi); }
.plate .dev { margin-top: .5vh; font: italic clamp(10px, .9vw, 14px)/1 var(--latin); color: var(--sepia); display: flex; gap: .45em; justify-content: center; align-items: center; }
.plate .dev .bud { width: .8em; height: .8em; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #4a3a2c; }
.plate .dev .bud.on { background: var(--rose-hi); box-shadow: 0 0 8px var(--rose-hi); }
#l1 .plate .dev .bud.on { background: var(--blue-hi); box-shadow: 0 0 8px var(--blue-hi); }
.seal { position: absolute; bottom: 12%; width: clamp(34px, 3.6vw, 60px); aspect-ratio: 1; display: grid; place-items: center;
  font-size: clamp(20px, 2.3vw, 38px); color: #fbe9d9; border-radius: 12%;
  box-shadow: inset 0 0 0 3px rgba(251,233,217,.85), inset 0 0 0 5px currentColor, 0 2px 6px rgba(0,0,0,.6);
  transform: rotate(-8deg); transition: opacity .25s, transform .25s; }
#l0 .seal { left: -10%; }
#l1 .seal { right: -10%; transform: rotate(8deg); }
.seal.atk { background: radial-gradient(circle at 40% 35%, #c8283f, #8c0c1f); }
.seal.def { background: radial-gradient(circle at 40% 35%, #3d5ea8, #1c3570); }
.seal.off { opacity: 0; transform: scale(1.6) rotate(-20deg); }
.feed { position: absolute; top: calc(100% + 13vh); left: 50%; transform: translateX(-50%); width: 120%;
  display: flex; flex-direction: column; align-items: center; gap: .3vh; font: italic clamp(10px, .85vw, 14px)/1.25 var(--latin); color: var(--sepia); }
.feed div { white-space: nowrap; animation: fadein .3s ease-out; }
.feed b { font: normal 1.1em var(--serif); color: var(--parch); margin-right: .4em; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } }

#glove { position: absolute; left: 0; top: 0; width: min(10vw, 19vh); aspect-ratio: 1; opacity: 0; pointer-events: none; z-index: 8; }
#glove svg { width: 100%; height: 100%; overflow: visible; }

/* ---------- command text ---------- */
#call { position: absolute; left: 0; right: 0; top: 18vh; z-index: 20; text-align: center; pointer-events: none; }
#call .jp { display: inline-block; font-size: clamp(44px, 8.5vw, 160px); line-height: 1; letter-spacing: .06em;
  color: #fffaf0; -webkit-text-stroke: clamp(2px, .28vw, 5px) var(--ink); paint-order: stroke fill;
  text-shadow: .25vw .35vw 0 var(--ink), 0 0 3vw rgba(0,0,0,.6); }
#call .jp.rose { color: #ffe3e6; text-shadow: .25vw .35vw 0 #4a0410, 0 0 3vw rgba(217,48,74,.6); }
#call .jp.blue { color: #e6efff; text-shadow: .25vw .35vw 0 #0c1736, 0 0 3vw rgba(91,127,208,.6); }
#call .jp.gilt { color: var(--gilt-hi); text-shadow: .25vw .35vw 0 #3a2508, 0 0 3vw rgba(236,210,139,.6); }
#call .jp.dim { color: var(--parch); opacity: .9; }
#call .en { display: block; margin-top: .8vh; font: italic clamp(15px, 1.8vw, 32px)/1.2 var(--latin); color: var(--ivory);
  letter-spacing: .04em; text-shadow: 0 2px 0 #000, 0 0 10px #000; }
#call .en small { display: block; margin-top: .5vh; font-size: .62em; color: var(--gilt-hi); letter-spacing: .12em; }

#title { position: absolute; left: 0; right: 0; top: 17vh; z-index: 19; text-align: center; pointer-events: none; }
#title .t { display: block; font-size: clamp(36px, 5.6vw, 110px); letter-spacing: .14em; padding-left: .14em; color: var(--ivory);
  -webkit-text-stroke: clamp(1px, .2vw, 4px) var(--ink); paint-order: stroke fill; text-shadow: .3vw .4vw 0 var(--ink); }
#title .e { display: block; margin-top: 1vh; font: italic clamp(14px, 1.7vw, 30px)/1 var(--latin); letter-spacing: .5em; color: var(--gilt-hi); }
#title .rule { display: block; width: 26vw; height: 1px; margin: 2.2vh auto; background: linear-gradient(90deg, transparent, var(--gilt), transparent); }
#title .p { display: inline-block; font-size: clamp(13px, 1.4vw, 24px); letter-spacing: .3em; animation: breathe 2.2s ease-in-out infinite; }
#title .p i { font: italic .9em var(--latin); letter-spacing: .1em; color: var(--gilt-hi); margin-left: .6em; }
@keyframes breathe { 50% { opacity: .35; } }
.hidden { display: none !important; }

.dmg { position: absolute; z-index: 22; pointer-events: none; transform: translate(-50%, -50%); text-align: center;
  font: italic clamp(30px, 4.4vw, 78px)/1 var(--latin); color: #fff1e6;
  -webkit-text-stroke: clamp(2px, .22vw, 4px) #5e0614; paint-order: stroke fill; text-shadow: .2vw .3vw 0 #2a0208; }
.dmg.crit { color: var(--gilt-hi); -webkit-text-stroke-color: #3a2508; }
.dmg small { display: block; font: .36em/1.4 var(--serif); letter-spacing: .3em; }
.petal { position: fixed; z-index: 21; width: 1.3vw; height: 1.7vw; pointer-events: none; border-radius: 0 100% 0 100%;
  background: radial-gradient(ellipse at 30% 30%, var(--a), var(--b)); box-shadow: inset -2px -2px 4px rgba(0,0,0,.25); }

/* ---------- K.O. ---------- */
#ko { position: absolute; inset: 0; z-index: 25; pointer-events: none; display: grid; place-content: center; text-align: center;
  background: radial-gradient(ellipse, rgba(27,18,12,.35), rgba(12,8,5,.85)); }
#ko .k { font-size: clamp(64px, 12vw, 230px); letter-spacing: .2em; padding-left: .2em; color: #fffaf0;
  -webkit-text-stroke: clamp(2px, .3vw, 6px) var(--ink); paint-order: stroke fill; text-shadow: .35vw .5vw 0 var(--ink), 0 0 5vw rgba(0,0,0,.8); }
#ko .w { margin-top: 1.5vh; font: italic clamp(18px, 2.4vw, 42px)/1.2 var(--latin); color: var(--gilt-hi); }
#ko .w b { font: normal 1.15em var(--serif); letter-spacing: .25em; color: var(--ivory); }
#ko .again { margin-top: 3.5vh; font-size: clamp(12px, 1.25vw, 20px); letter-spacing: .3em; color: var(--parch); animation: breathe 2.2s ease-in-out infinite; }

/* ---------- bottom: tiles + key legend ---------- */
#tiles { position: absolute; left: 50%; bottom: 3vh; transform: translateX(-50%); z-index: 12; display: flex; gap: .9vw; }
.tile { width: clamp(54px, 5vw, 88px); aspect-ratio: 1; cursor: pointer; padding: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .25em;
  background: linear-gradient(160deg, #fbf5e6, #e6d7b5); color: #3a2718;
  border: 2px solid #8a6a48; box-shadow: inset 0 0 0 3px #fbf5e6, inset 0 0 0 4px #b39a72, 0 3px 0 #2a1b12, 0 6px 12px rgba(0,0,0,.5);
  font: clamp(15px, 1.5vw, 26px)/1 var(--serif); letter-spacing: .1em; transition: transform .1s, filter .15s; }
.tile i { font: italic clamp(9px, .75vw, 13px)/1 var(--latin); letter-spacing: 0; color: #7a5a3a; }
.tile:hover { filter: brightness(1.06); }
.tile:active, .tile.press { transform: translateY(2px); box-shadow: inset 0 0 0 3px #fbf5e6, inset 0 0 0 4px #b39a72, 0 1px 0 #2a1b12, 0 3px 6px rgba(0,0,0,.5); }
.tile.off { opacity: .55; }
.keys { position: absolute; bottom: 3vh; z-index: 12; display: grid; grid-template-columns: repeat(3, auto); gap: .45vw; }
#keys0 { left: 3vw; }
#keys1 { right: 3vw; }
.key { display: flex; align-items: center; gap: .5em; padding: .35em .6em; background: rgba(239,228,204,.08); border: 1px solid rgba(201,162,75,.35);
  font-size: clamp(11px, .95vw, 15px); white-space: nowrap; transition: background .1s, border-color .1s; }
.key kbd { display: inline-grid; place-items: center; min-width: 1.7em; height: 1.7em; font: bold clamp(11px, .95vw, 15px)/1 var(--latin);
  color: var(--ink); background: linear-gradient(160deg, #fbf5e6, #d9c69e); border-radius: 3px; box-shadow: 0 2px 0 #5a4228; }
.key.hit { background: rgba(236,210,139,.3); border-color: var(--gilt-hi); }
.keyhint { grid-column: 1 / -1; font: italic clamp(10px, .8vw, 13px)/1.3 var(--latin); color: var(--sepia); }
#toast { position: fixed; left: 50%; top: 10vh; transform: translateX(-50%); z-index: 40; padding: .5em 1.4em;
  background: rgba(18,11,8,.85); border: 1px solid var(--gilt-lo); font-size: clamp(12px, 1vw, 16px); letter-spacing: .1em;
  opacity: 0; transition: opacity .3s; pointer-events: none; }
#toast.show { opacity: 1; }
#offline { position: fixed; top: 0; left: 0; right: 0; z-index: 50; text-align: center; background: #6e0f1f; padding: .3em; font-size: 14px; letter-spacing: .1em; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="g-rose" cx="45%" cy="40%"><stop offset="0" stop-color="#e8485e"/><stop offset=".7" stop-color="#a3122a"/><stop offset="1" stop-color="#5e0614"/></radialGradient>
    <radialGradient id="g-cam" cx="45%" cy="40%"><stop offset="0" stop-color="#fff4f2"/><stop offset=".75" stop-color="#f0c6cc"/><stop offset="1" stop-color="#c77b88"/></radialGradient>
    <linearGradient id="g-gilt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4dd9a"/><stop offset=".45" stop-color="#c9a24b"/><stop offset=".7" stop-color="#7a5a22"/><stop offset="1" stop-color="#d9b866"/></linearGradient>
    <radialGradient id="g-ground0" cx="50%" cy="40%"><stop offset="0" stop-color="#8e1a2e"/><stop offset="1" stop-color="#3e0610"/></radialGradient>
    <radialGradient id="g-ground1" cx="50%" cy="40%"><stop offset="0" stop-color="#34528f"/><stop offset="1" stop-color="#0f1a38"/></radialGradient>
    <linearGradient id="g-shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset=".6" stop-color="#efe4cc"/><stop offset="1" stop-color="#cdbb98"/></linearGradient>
    <symbol id="rose" viewBox="-20 -20 40 40">
      <path d="M-14 6 C-20 -4 -12 -16 0 -16 C12 -16 20 -4 14 6 C10 14 -10 14 -14 6 Z" fill="url(#g-rose)" stroke="#3e0610" stroke-width="1.4"/>
      <path d="M-8 2 C-10 -6 -2 -11 4 -8 C9 -5 8 2 3 3 C-1 4 -3 0 0 -2" fill="none" stroke="#3e0610" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M-12 8 C-6 14 6 14 12 8" fill="none" stroke="#3e0610" stroke-width="1.2"/>
      <path d="M-4 14 L-10 20 M4 14 L12 19" stroke="#2f4a1e" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="camellia" viewBox="-20 -20 40 40">
      <g fill="url(#g-cam)" stroke="#8c3a48" stroke-width="1.2">
        <ellipse cx="0" cy="-10" rx="8" ry="9"/><ellipse cx="9.5" cy="-3" rx="8" ry="9" transform="rotate(72 9.5 -3)"/>
        <ellipse cx="6" cy="8.5" rx="8" ry="9" transform="rotate(144 6 8.5)"/><ellipse cx="-6" cy="8.5" rx="8" ry="9" transform="rotate(216 -6 8.5)"/>
        <ellipse cx="-9.5" cy="-3" rx="8" ry="9" transform="rotate(288 -9.5 -3)"/>
      </g>
      <circle r="5" fill="#f2c94c" stroke="#a87b12" stroke-width="1"/>
      <g stroke="#a87b12" stroke-width=".9"><path d="M0 -5 V-2 M4.3 -2.5 L2 -1 M4.3 2.5 L2 1 M0 5 V2 M-4.3 2.5 L-2 1 M-4.3 -2.5 L-2 -1"/></g>
    </symbol>
    <symbol id="handprint" viewBox="-30 -40 60 70">
      <ellipse cx="0" cy="8" rx="17" ry="19"/>

/* ---------------- sound (synthesised, no files) ---------------- */
const Sfx = {
  ctx: null, muted: false,
  wake() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
    if (this.ctx.state === "suspended") this.ctx.resume();
  },
  ok() { return this.ctx && !this.muted && this.ctx.state === "running"; },
  gain(t, peak, dur, dest) {
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(dest || this.ctx.destination);
    return g;
  },
  noise(dur) {
    const c = this.ctx, n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = b; return s;
  },
  slap(k = 1) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime;
    const n = this.noise(0.25), f = c.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = 1700; f.Q.value = 0.7;
    n.connect(f); f.connect(this.gain(t, 0.95 * k, 0.15)); n.start(t);
    const o = c.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.18);
    o.connect(this.gain(t, 0.6 * k, 0.2)); o.start(t); o.stop(t + 0.25);
  },
  whoosh(v = 0.3) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime, n = this.noise(0.4), f = c.createBiquadFilter();
    f.type = "bandpass"; f.Q.value = 1.6;
    f.frequency.setValueAtTime(350, t); f.frequency.exponentialRampToValueAtTime(2600, t + 0.28);
    n.connect(f); f.connect(this.gain(t, v, 0.3)); n.start(t);
  },
  fan() {   // a fan snapping open: short low rustle + a soft chime
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime, n = this.noise(0.2), f = c.createBiquadFilter();
    f.type = "lowpass"; f.frequency.value = 900;
    n.connect(f); f.connect(this.gain(t, 0.5, 0.12)); n.start(t);
    [1318, 1975].forEach((fr, i) => { const o = c.createOscillator(); o.type = "sine"; o.frequency.value = fr;
      o.connect(this.gain(t + 0.03, 0.12 / (i + 1), 0.9)); o.start(t + 0.03); o.stop(t + 1); });
  },
  pluck(fr, when = 0, vol = 0.16) {   // harpsichord-ish
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + when, o = c.createOscillator(), f = c.createBiquadFilter();
    o.type = "sawtooth"; o.frequency.value = fr;
    f.type = "lowpass"; f.frequency.setValueAtTime(fr * 8, t); f.frequency.exponentialRampToValueAtTime(fr * 1.5, t + 0.4);
    o.connect(f); f.connect(this.gain(t, vol, 0.7)); o.start(t); o.stop(t + 0.75);
  },
  flourish() { [523, 659, 784, 1047].forEach((fr, i) => this.pluck(fr, i * 0.07)); },
  bell() {   // inharmonic partials of a bell
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime;
    [[220, .5], [220 * 2.76, .22], [220 * 5.4, .1], [220 * 8.93, .05]].forEach(([fr, v]) => {
      const o = c.createOscillator(); o.type = "sine"; o.frequency.value = fr;
      o.connect(this.gain(t, v, 3.5)); o.start(t); o.stop(t + 3.6);
    });
  },
};

/* ---------------- helpers ---------------- */
function centerOf(i) { const r = $("l" + i).getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height * 0.42, w: r.width, h: r.height }; }
function cheekOf(i) { const c = centerOf(i); return { x: c.x + (i ? -1 : 1) * c.w * 0.2, y: c.y - c.h * 0.02 }; }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2200); }
function playerOf(name) { return /P2|DEF/.test(name) ? 1 : 0; }

function call(jp, cls = "", en = "", small = "", hold = 1200) {
  const a = $("call");
  a.innerHTML = "";
  const big = document.createElement("span");
  big.className = "jp " + cls; big.textContent = jp;
  a.appendChild(big);
  if (en) { const e = document.createElement("span"); e.className = "en"; e.textContent = en;
    if (small) { const s = document.createElement("small"); s.textContent = small; e.appendChild(s); } a.appendChild(e); }
  big.animate([
    { transform: "scale(1.5)", opacity: 0, filter: "blur(6px)" },
    { transform: "scale(.97)", opacity: 1, filter: "blur(0)", offset: 0.5 },
    { transform: "scale(1)", opacity: 1, filter: "blur(0)" },
  ], { duration: 360, easing: "cubic-bezier(.2,.8,.3,1.2)", fill: "forwards" });
  clearTimeout(call.h);
  call.h = setTimeout(() => {
    a.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: "forwards" })
      .onfinish = () => { if (a.firstChild === big) a.innerHTML = ""; a.getAnimations().forEach(x => x.cancel()); };
  }, hold);
}

function setHp(hp, animate = true) {
  for (const i of [0, 1]) {
    const v = Math.max(0, Math.min(100, hp[i]));
    const bar = $("hp" + i), fill = bar.querySelector(".fill"), trail = bar.querySelector(".trail"), em = bar.querySelector(".emblem");
    if (!animate) trail.style.transition = fill.style.transition = em.style.transition = "none";
    fill.style.width = `calc(${v}% - ${6 * v / 100}px)`;
    trail.style.width = `calc(${v}% - ${6 * v / 100}px)`;
    em.style.left = (i ? v : 100 - v) + "%";   // rides the moving end of the bar
    if (!animate) { void bar.offsetWidth; trail.style.transition = fill.style.transition = em.style.transition = ""; }
    bar.classList.toggle("low", v > 0 && v <= 30);
    $("hpn" + i).textContent = v;
  }
  S.hp = hp.slice();
}

function setRoles() {
  const show = !S.over && S.state !== "IDLE" && S.round > 0;
  for (const i of [0, 1]) {
    const s = $("seal" + i), atk = i === S.attacker;
    s.textContent = atk ? "攻" : "守";
    s.className = "seal " + (atk ? "atk" : "def") + (show ? "" : " off");
  }
}

function shake(k) {
  const px = 4 + 16 * k;
  $("stage").animate([
    { transform: "translate(0,0)" }, { transform: `translate(${-px}px,${px * 0.3}px)` },
    { transform: `translate(${px * 0.7}px,${-px * 0.4}px)` }, { transform: `translate(${-px * 0.4}px,${px * 0.2}px)` }, { transform: "translate(0,0)" },
  ], { duration: 240 + 180 * k, easing: "ease-out" });
}
function flash(v = 0.6) { $("flash").animate([{ opacity: v }, { opacity: 0 }], { duration: 300, easing: "ease-out" }); }
function inkSlash(def) {   // one brush stroke across the slapped cheek, in the slap's direction
  const s = $("slash"), c = cheekOf(def), r = s.getBoundingClientRect();
  s.style.left = c.x - r.width / 2 + "px"; s.style.top = c.y - r.height / 2 + "px";
  s.style.transform = def === 0 ? "scaleX(-1) rotate(-12deg)" : "rotate(-12deg)";
  s.animate([
    { opacity: 0, clipPath: "inset(0 100% 0 0)" }, { opacity: .92, clipPath: "inset(0 0 0 0)", offset: 0.25 },
    { opacity: .92, clipPath: "inset(0 0 0 0)", offset: 0.55 }, { opacity: 0, clipPath: "inset(0 0 0 0)" },
  ], { duration: 700, easing: "ease-out" });
}

function petals(i, x, y, n) {
  const [a, b] = LADY[i].petal;
  for (let k = 0; k < n; k++) {
    const p = document.createElement("div");
    p.className = "petal"; p.style.left = x + "px"; p.style.top = y + "px";
    p.style.setProperty("--a", a); p.style.setProperty("--b", b);
    document.body.appendChild(p);
    const ang = -Math.PI / 2 + (Math.random() - 0.5) * 2.6, v = 80 + Math.random() * 200;
    const dx = Math.cos(ang) * v, dy = Math.sin(ang) * v, fall = 260 + Math.random() * 260, rot = (Math.random() - 0.5) * 900;
    p.animate([
      { transform: "translate(0,0) rotate(0deg) scale(.6)", opacity: 1 },
      { transform: `translate(${dx}px,${dy}px) rotate(${rot * 0.4}deg) scale(1)`, opacity: 1, offset: 0.3 },
      { transform: `translate(${dx * 1.4 + (Math.random() - 0.5) * 80}px,${dy + fall}px) rotate(${rot}deg) scale(.9)`, opacity: 0 },
    ], { duration: 1400 + Math.random() * 900, easing: "cubic-bezier(.2,.6,.4,1)" }).onfinish = () => p.remove();
  }
}

function popDamage(i, dmg, label, crit) {
  if (!dmg) return;
  const c = cheekOf(i), d = document.createElement("div");
  d.className = "dmg" + (crit ? " crit" : "");
  d.innerHTML = `−${dmg}${label ? `<small>${label}</small>` : ""}`;
  const cc = centerOf(i);
  d.style.left = cc.x + (i ? 1 : -1) * cc.w * 0.62 + "px"; d.style.top = cc.y - cc.h * 0.18 + "px";
  document.body.appendChild(d);
  d.animate([
    { transform: "translate(-50%,-30%) scale(.5)", opacity: 0 },
    { transform: "translate(-50%,-60%) scale(1.15)", opacity: 1, offset: 0.2 },
    { transform: "translate(-50%,-90%) scale(1)", opacity: 1, offset: 0.7 },
    { transform: "translate(-50%,-140%) scale(.95)", opacity: 0 },
  ], { duration: 1400, easing: "ease-out" }).onfinish = () => d.remove();
}

// White-gloved hand sweeps from `from`'s side across `to`'s cheek. Returns ms until contact.
function swing(from, to, connects = true) {
  const g = $("glove"), a = centerOf(from), b = cheekOf(to);
  const gw = g.getBoundingClientRect().width || 110, dir = to > from ? 1 : -1;
  const x0 = a.x + dir * a.w * 0.35 - gw / 2, x1 = b.x - dir * gw * (connects ? 0.2 : -1.1) - gw / 2, y = b.y - gw / 2;
  g.animate([
    { transform: `translate(${x0}px,${y - gw * 0.5}px) rotate(${-55 * dir}deg) scaleX(${dir})`, opacity: 0 },
    { transform: `translate(${x0}px,${y - gw * 0.4}px) rotate(${-45 * dir}deg) scaleX(${dir})`, opacity: 1, offset: 0.15 },
    { transform: `translate(${x1}px,${y}px) rotate(${8 * dir}deg) scaleX(${dir})`, opacity: 1, offset: 0.58 },
    { transform: `translate(${x1 + dir * gw * 0.7}px,${y + gw * 0.15}px) rotate(${28 * dir}deg) scaleX(${dir})`, opacity: 0 },
  ], { duration: 380, easing: "cubic-bezier(.5,0,.6,1)" });
  return 220;
}

function recoil(i, k) {
  const l = $("l" + i), cam = l.querySelector(".cameo"), dir = i === 1 ? 1 : -1;
  cam.animate([
    { transform: "none" },
    { transform: `translateX(${dir * 9 * k}%) rotate(${dir * 13 * k}deg)`, offset: 0.12 },
    { transform: `translateX(${-dir * 3 * k}%) rotate(${-dir * 5 * k}deg)`, offset: 0.45 },
    { transform: `rotate(${dir * 2 * k}deg)`, offset: 0.7 },
    { transform: "none" },
  ], { duration: 900 + 300 * k, easing: "cubic-bezier(.2,.9,.3,1)" });
  l.classList.remove("ouch"); void l.offsetWidth; l.classList.add("ouch");
  clearTimeout(l.ouchH); l.ouchH = setTimeout(() => l.classList.remove("ouch"), 1100);
  const p = l.querySelector(".print");
  p.classList.add("show"); void p.getBoundingClientRect(); setTimeout(() => p.classList.remove("show"), 1000);
}

function evade(i, cls) {
  const cam = $("l" + i).querySelector(".cameo"), dir = cls === "dodge_left" ? -1 : 1;
  cam.animate([
    { transform: "none", filter: "blur(0)" },
    { transform: `translateX(${dir * 26}%) rotate(${dir * 6}deg)`, filter: "blur(3px)", offset: 0.2 },
    { transform: `translateX(${dir * 22}%) rotate(${dir * 5}deg)`, filter: "blur(0)", offset: 0.6 },
    { transform: "none", filter: "blur(0)" },
  ], { duration: 760, easing: "cubic-bezier(.2,.9,.3,1)" });
}

function fanBlock(i) {
  $("l" + i).querySelector(".fan").animate([
    { transform: "translate(-50%,-50%) scale(.2) rotate(-70deg)", opacity: 0 },
    { transform: "translate(-50%,-50%) scale(1.05) rotate(0deg)", opacity: 1, offset: 0.25 },
    { transform: "translate(-50%,-50%) scale(1) rotate(0deg)", opacity: 1, offset: 0.7 },
    { transform: "translate(-50%,-50%) scale(.9) rotate(20deg)", opacity: 0 },
  ], { duration: 900, easing: "cubic-bezier(.2,.9,.3,1.2)" });
}

function puzzle(i) {
  $("l" + i).querySelector(".cameo").animate([
    { transform: "none" }, { transform: "rotate(-5deg)" }, { transform: "rotate(5deg)" }, { transform: "rotate(-3deg)" }, { transform: "none" },
  ], { duration: 800 });
}

function impact(def, k, crit) {
  recoil(def, k);
  const c = cheekOf(def);
  petals(def, c.x, c.y, Math.round(8 + 14 * k));
  shake(k);
  Sfx.slap(k);
  if (k >= 1 || crit) { flash(crit ? 0.55 : 0.4); inkSlash(def); }
}

/* ---------------- referee messages ---------------- */
function onResult(m, animate) {
  const atk = m.attacker, def = atk ^ 1, k = STRENGTH[m.strength] || 0.8;
  const o = OUTCOME[m.outcome] || { jp: m.outcome, en: "", cls: "" };
  if (!animate) { setHp(m.hp, false); return; }
  const delta = m.delta_ms ? `Δ ${m.delta_ms} ms` : "";
  const who = (i) => LADY[i].name;
  switch (m.outcome) {
    case "HIT": case "JUMPED": {
      const t = swing(atk, def);
      setTimeout(() => { impact(def, k, false); setHp(m.hp); popDamage(def, m.damage, m.strength === "heavy" ? "重" : ""); }, t);
      call(m.strength === "heavy" && m.outcome === "HIT" ? "痛击" : o.jp, o.cls, m.strength === "heavy" && m.outcome === "HIT" ? "A stinging blow!" : o.en, delta);
      break;
    }
    case "FEINT_PUNISHED": {
      const t = swing(atk, def);
      setTimeout(() => { impact(def, 1.2, true); setHp(m.hp); popDamage(def, m.damage, "暴击", true); }, t);
      call(o.jp, o.cls, o.en, `${who(def)} 上当后挨了真的`);
      break;
    }
    case "GRAZE": {
      evade(def, m.defense);
      const t = swing(atk, def);
      setTimeout(() => { impact(def, 0.4, false); setHp(m.hp); popDamage(def, m.damage, "擦"); }, t);
      call(o.jp, o.cls, o.en, delta);
      break;
    }
    case "BLOCKED": {
      const t = swing(atk, def);
      setTimeout(() => { fanBlock(def); Sfx.fan(); shake(0.25); setHp(m.hp); popDamage(def, m.damage, "挡"); }, t);
      call(o.jp, o.cls, o.en, "伤害减半 · half damage");
      break;
    }
    case "MISS": {
      evade(def, m.defense); swing(atk, def, false); Sfx.whoosh();
      call(o.jp, o.cls, o.en, delta);
      break;
    }
    case "COUNTERED": {
      evade(def, m.defense); swing(atk, def, false); Sfx.whoosh();
      setTimeout(() => {
        const t = swing(def, atk);
        setTimeout(() => { impact(atk, 1.1, true); setHp(m.hp); popDamage(atk, m.counter_damage, "反击", true); }, t);
      }, 440);
      call(o.jp, o.cls, o.en, `${who(def)} 闪开后反手一记`, 1500);
      break;
    }
    case "FEINT_FOOLED": case "FEINT_HELD":
      puzzle(def); setHp(m.hp); Sfx.whoosh(0.15); call(o.jp, o.cls, o.en, o.jp === "中计" ? "下回合防守窗口缩短" : "");
      break;
    default:
      setHp(m.hp); Sfx.pluck(196, 0, 0.12); Sfx.pluck(147, 0.12, 0.12); call(o.jp, o.cls, o.en);
  }
}

function onGameOver(m, animate) {
  S.over = true;
  setHp(m.hp, animate);
  const loser = m.winner ^ 1;
  const show = () => {
    $("l" + loser).classList.add("ko");
    $("winner").innerHTML = `<b>${LADY[m.winner].name}</b> 胜 · ${LADY[m.winner].en} prevails`;
    $("ko").classList.remove("hidden");
    if (animate) {
      $("ko").querySelector(".k").animate([{ transform: "scale(1.4)", opacity: 0, filter: "blur(8px)" }, { transform: "scale(1)", opacity: 1, filter: "blur(0)" }],
        { duration: 700, easing: "cubic-bezier(.2,.8,.3,1)", fill: "forwards" });
      flash(0.8); shake(1.2); Sfx.bell();
      const c = centerOf(loser);
      petals(loser, c.x, c.y, 36);
      setTimeout(() => petals(m.winner, window.innerWidth / 2, window.innerHeight * 0.1, 30), 500);
    }
    setRoles();
  };
  if (animate) setTimeout(show, 900); else show();
}

function resetBoard() {
  S.over = false; S.round = 0; S.deadline = 0;
  $("roundtag").textContent = "— Prologue —";
  $("ko").classList.add("hidden");
  $("l0").classList.remove("ko"); $("l1").classList.remove("ko");
  setHp([100, 100], false);
}

const ROMAN = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII", "XIII", "XIV", "XV", "XVI", "XVII", "XVIII", "XIX", "XX"];
function handle(m, animate = true) {
  switch (m.type) {
    case "peer": {
      const i = playerOf(m.name), bud = $("bud" + i), was = bud.classList.contains("on");
      bud.classList.toggle("on", !!m.connected);
      $("dev" + i).textContent = m.name + (m.connected ? "" : " · 离线");
      if (animate && was !== !!m.connected) toast(`${m.name} ${m.connected ? "已连接" : "断开"}`);
      break;
    }
    case "state":
      S.state = m.state;
      if (m.state === "IDLE") resetBoard();
      if (m.state === "ARMED" && !S.deadline) S.deadline = performance.now() + ATTACK_TIMEOUT_MS;
      S.judging = m.state === "JUDGING";
      if (m.state !== "ARMED" && m.state !== "JUDGING") S.deadline = 0;
      $("title").classList.toggle("hidden", m.state !== "IDLE");
      if (animate && m.state === "ARMED") call("出手", "", "Strike her cheek!", `${LADY[S.attacker].name} 进攻`, 900);
      setRoles();
      break;
    case "announce":
      if (m.round === 1) resetBoard();
      S.round = m.round; S.attacker = m.attacker; S.deadline = 0;
      $("roundtag").textContent = `— Round ${ROMAN[m.round] || m.round} —`;
      $("title").classList.add("hidden");
      setRoles();
      if (animate) {
        call(`第${"一二三四五六七八九十"[m.round - 1] || m.round}回合`, "", `Round ${ROMAN[m.round] || m.round}`, `${LADY[m.attacker].name} 先出手`, 1100);
        if (m.round === 1) Sfx.flourish(); else Sfx.pluck(392, 0, 0.14);
      }
      break;
    case "result": onResult(m, animate); break;
    case "game_over": onGameOver(m, animate); break;
    case "event": if (animate) addEvent(m); break;
    case "snapshot":
      setMode(m.mode || "referee");
      for (const x of m.items) handle(x, false);
      break;
  }
}

function addEvent(m) {
  const i = playerOf(m.from), feed = $("feed" + i);
  const e = document.createElement("div");
  e.innerHTML = `<b>${CLS[m.cls] || m.cls}</b>${Math.round((m.conf / 255) * 100)}% · ${m.peak}°/s · ${m.rx - m.t} ms`;
  feed.appendChild(e);
  while (feed.children.length > 2) feed.firstChild.remove();
  const l = $("l" + i);
  l.classList.add("glow"); clearTimeout(l.glowH); l.glowH = setTimeout(() => l.classList.remove("glow"), 260);
  if (m.cls === "forehand" || m.cls === "backhand" || m.cls === "feint") Sfx.whoosh(0.12);
}

/* ---------------- pocket watch ---------------- */
const arc = document.querySelector("#watch .arc"), CIRC = 219.9;
function tick() {
  const w = $("watch"), num = $("watchnum");
  if (S.deadline) {
    const left = Math.max(0, S.deadline - performance.now());
    w.classList.remove("idle");
    w.classList.toggle("judging", S.judging);
    w.classList.toggle("urgent", left < 1500 && !S.judging);
    num.textContent = S.judging ? "判定" : Math.ceil(left / 1000);
    arc.style.strokeDashoffset = CIRC * (1 - left / ATTACK_TIMEOUT_MS);
  } else {
    w.classList.add("idle"); w.classList.remove("urgent", "judging");
    arc.style.strokeDashoffset = CIRC;
    num.textContent = S.over ? "终" : S.state === "IDLE" ? "待机" : S.state === "ANNOUNCE" ? "预备" : "·";
  }
  requestAnimationFrame(tick);
}

/* ---------------- keyboard play ---------------- */
function setMode(mode) {
  S.mode = mode;
  const keys = mode === "keys";
  for (const i of [0, 1]) $("keys" + i).classList.toggle("hidden", !keys);
  $("presshint").innerHTML = keys ? "按 空格 开局 · 双人键盘对战<i>Press Space</i>" : "按 空格 开局<i>Press Space</i>";
}
function buildLegend() {
  const label = { forehand: "正手", backhand: "反手", feint: "虚招", dodge_left: "左闪", dodge_right: "右闪", block: "扇挡" };
  for (const i of [0, 1]) {
    const box = $("keys" + i);
    const order = ["feint", "forehand", "backhand", "dodge_left", "block", "dodge_right"];
    for (const cls of order) {
      const code = Object.keys(KEYMAP).find(c => KEYMAP[c][0] === i && KEYMAP[c][1] === cls);
      const d = document.createElement("div");
      d.className = "key"; d.id = "k-" + code;
      d.innerHTML = `<kbd>${code.slice(3)}</kbd>${label[cls]}`;
      box.appendChild(d);
    }
    const h = document.createElement("div");
    h.className = "keyhint";
    h.textContent = i ? "Shift 重 · Alt 轻 · forehand → dodge right" : "Shift 重 · Alt 轻 · 正手往右闪、反手往左闪";
    box.appendChild(h);
  }
}
function keyAction(e) {
  const k = KEYMAP[e.code];
  if (!k || S.mode !== "keys") return false;
  const [p, cls] = k;
  const peak = e.shiftKey ? 900 : e.altKey ? 250 : 550;   // heavy / light / medium (PEAK_*_DPS tiers)
  send(`ev ${p} ${cls} ${peak}`, true);
  const cap = $("k-" + e.code);
  if (cap) { cap.classList.add("hit"); setTimeout(() => cap.classList.remove("hit"), 160); }
  return true;
}

/* ---------------- commands ---------------- */
async function send(cmd, quiet = false) {
  Sfx.wake();
  try {
    const r = await fetch("/cmd", { method: "POST", body: cmd });
    if (r.status === 409 && !quiet) toast("当前数据来源不接受指令（stdin / 回放）");
  } catch (e) { if (!quiet) toast("送不出指令：后端没开？"); }
}
document.querySelectorAll("[data-cmd]").forEach(b => b.addEventListener("click", () => send(b.dataset.cmd)));
function toggleMute() { Sfx.wake(); Sfx.muted = !Sfx.muted; $("mute").classList.toggle("off", Sfx.muted); $("mute").firstChild.textContent = Sfx.muted ? "静音" : "音效"; }
function toggleFs() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
function pressTile(sel) { const t = document.querySelector(sel); if (t) { t.classList.add("press"); setTimeout(() => t.classList.remove("press"), 120); } }
$("mute").addEventListener("click", toggleMute);
$("fs").addEventListener("click", toggleFs);
document.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (keyAction(e)) { e.preventDefault(); return; }
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); pressTile("[data-cmd=start]"); send("start"); }
  else if (e.code === "KeyR") { pressTile("[data-cmd=reset]"); send("reset"); }
  else if (e.code === "KeyM") { pressTile("#mute"); toggleMute(); }
  else if (e.code === "KeyF") { pressTile("#fs"); toggleFs(); }
});
document.addEventListener("keyup", (e) => { if (e.key === "Alt") e.preventDefault(); });   // keep Alt from opening the browser menu
document.addEventListener("pointerdown", () => Sfx.wake(), { once: true });

/* ---------------- stream ---------------- */
function connect() {
  const es = new EventSource("/events");
  es.onopen = () => $("offline").classList.add("hidden");
  es.onmessage = (ev) => { try { handle(JSON.parse(ev.data)); } catch (err) { console.error(err, ev.data); } };
  es.onerror = () => $("offline").classList.remove("hidden");
}
for (const i of [0, 1]) $("l" + i).innerHTML = cameoSVG(i);
buildLegend();
setHp([100, 100], false);
requestAnimationFrame(tick);
connect();
</script>
</body>
</html>

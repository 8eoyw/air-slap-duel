<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空气巴掌 · 绷不住大赛</title>
<!--
  Served by tools/web_dashboard.py; listens to /events (SSE), posts commands to /cmd.
  No external assets: works offline at the demo.

  Subject: 奶蛙 — the yellow, frog-shaped AI remix of the 奶龙 meme: bulging eyes with greenish
  whites and dot pupils, a pear-shaped body with a cream belly, olive-brown hands and feet, and a
  laugh it cannot stop. Its internet vernacular: "我在绷不住大赛中坚持了XX秒", livestream 连麦 audio,
  famous-painting remixes (拿破蛙). Fan art of a meme, drawn here from scratch.

  Concept: the duel is a 连麦 PK livestream. Two stream panels side by side; BLE link = 连麦中;
  HP = 绷住值 on a PK tug bar; hits arrive as gift banners with combo counts; outcomes fly past as
  danmaku; real sensor events land in the chat box. 绷住值 0 = 绷不住了: the loser laughs and can't stop.

  Tokens
    奶蛙黄 #F6C933  奶油肚 #FFF1D6  橄榄褐 #6E5530  眼白绿 #A8D27A  PK红 #FF3B6B  PK蓝 #2F80FF  夜 #1A1430
    type   heavy YaHei for UI and danmaku; Arial Rounded for numbers; 幼圆 for soft captions
    layout top bar (avatars · PK timer) → PK bar → two stream panels → chat · buttons · keys
-->
<style>
:root {
  --frog: #f6c933;
  --frog-hi: #ffe58a;
  --frog-lo: #d39b17;
  --belly: #fff1d6;
  --olive: #6e5530;
  --sclera: #a8d27a;
  --red: #ff3b6b;
  --blue: #2f80ff;
  --night: #1a1430;
  --ui: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  --num: "Arial Rounded MT Bold", "Arial Rounded MT", "Nunito", "Microsoft YaHei UI", sans-serif;
  --soft: "YouYuan", "幼圆", "Yuanti SC", "Microsoft YaHei UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: #fff; font-family: var(--ui); }
body { user-select: none; }
button { font-family: inherit; }

#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto auto 1fr auto; gap: 1.2vh; padding: 2vh 2.2vw 2.2vh;
  background:
    radial-gradient(ellipse 60% 50% at 20% 0%, rgba(255,59,107,.22), transparent 70%),
    radial-gradient(ellipse 60% 50% at 80% 0%, rgba(47,128,255,.22), transparent 70%),
    radial-gradient(circle at 50% 120%, rgba(246,201,51,.18), transparent 60%),
    var(--night); }

/* ---------- top bar ---------- */
#top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1.5vw; }
.host { display: flex; align-items: center; gap: .8vw; min-width: 0; }
.host.p2 { flex-direction: row-reverse; text-align: right; }
.avatar { position: relative; flex: none; width: clamp(40px, 4.4vw, 74px); aspect-ratio: 1; border-radius: 50%; background: var(--belly); overflow: hidden;
  box-shadow: 0 0 0 3px var(--c), 0 0 18px var(--c); }
.avatar svg { position: absolute; left: -12%; top: 4%; width: 124%; }
.avatar .laugh, .avatar .hurt, .avatar .guard, .avatar .dizzy, .avatar .print { display: none; }   /* resting face only */
.host .who { min-width: 0; }
.host .name { font-size: clamp(16px, 1.7vw, 30px); font-weight: 900; line-height: 1.1; }
.host .meta { display: flex; gap: .5em; align-items: center; margin-top: .35vh; font-size: clamp(10px, .9vw, 15px); opacity: .85; }
.host.p2 .meta { justify-content: flex-end; }
.live { padding: .15em .6em; border-radius: 99px; font-weight: 700; background: rgba(255,255,255,.14); }
.live.on { background: #2ad06b; color: #062b14; }
.live.on::before { content: ""; display: inline-block; width: .5em; height: .5em; margin-right: .35em; border-radius: 50%; background: #062b14; animation: blip 1s infinite; vertical-align: .05em; }
@keyframes blip { 50% { opacity: .2; } }
.host .dev { font-family: var(--num); opacity: .7; }

#pkbadge { position: relative; display: flex; flex-direction: column; align-items: center; }
#pkbadge .pk { font: italic 900 clamp(24px, 3vw, 52px)/1 var(--num); letter-spacing: -.02em;
  background: linear-gradient(90deg, var(--red) 0 50%, var(--blue) 50%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0,0,0,.6)); }
#pkbadge .clock { margin-top: .3vh; padding: .2em .9em; border-radius: 99px; background: rgba(0,0,0,.45); font-size: clamp(11px, 1vw, 17px); white-space: nowrap; }
#pkbadge .clock b { font: clamp(13px, 1.25vw, 21px)/1 var(--num); color: var(--frog); margin: 0 .15em; }
#pkbadge.urgent .clock b { color: var(--red); animation: blip .5s infinite; }

/* ---------- PK bar (绷住值) ---------- */
#pk { position: relative; height: clamp(22px, 3.4vh, 38px); border-radius: 99px; overflow: hidden; background: #2a2244; box-shadow: inset 0 2px 6px rgba(0,0,0,.6); }
#pk .r, #pk .b { position: absolute; top: 0; bottom: 0; transition: width .35s cubic-bezier(.3,1.4,.5,1); }
#pk .r { left: 0; background: linear-gradient(180deg, #ff7a98, var(--red) 55%, #c4123e); }
#pk .b { right: 0; background: linear-gradient(180deg, #7fb2ff, var(--blue) 55%, #1652c4); }
#pk .v { position: absolute; top: 50%; width: clamp(30px, 3.2vw, 54px); aspect-ratio: 1; transform: translate(-50%, -50%); transition: left .35s cubic-bezier(.3,1.4,.5,1);
  display: grid; place-items: center; border-radius: 50%; background: var(--frog); color: var(--olive); font: italic 900 clamp(11px, 1vw, 17px)/1 var(--num);
  box-shadow: 0 0 0 3px #fff, 0 0 14px #fff; }
#pk .n { position: absolute; top: 50%; transform: translateY(-50%); font: clamp(12px, 1.2vw, 20px)/1 var(--num); text-shadow: 0 1px 2px rgba(0,0,0,.7); white-space: nowrap; }
#pk .n small { font: 700 .75em var(--ui); opacity: .9; margin: 0 .4em; }
#pkn0 { left: 1.2em; }
#pkn1 { right: 1.2em; }

/* ---------- stream panels ---------- */
#streams { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: .5vw; min-height: 0; }
.panel { position: relative; overflow: hidden; border-radius: 20px; }
#s0 { background: radial-gradient(ellipse 80% 70% at 50% 40%, #ffd3dc, #ff9db3 60%, #e0607f); }
#s1 { background: radial-gradient(ellipse 80% 70% at 50% 40%, #d5e6ff, #93bcff 60%, #4f85e6); }
.panel::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 24%;
  background: linear-gradient(180deg, rgba(255,255,255,.0), rgba(255,255,255,.28)); }
.panel::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 4px); }
.tag { position: absolute; top: 1.4vh; z-index: 3; padding: .3em .8em; border-radius: 99px; background: rgba(0,0,0,.42);
  font-size: clamp(10px, .95vw, 16px); font-weight: 700; }
#s0 .tag { left: 1vw; }
#s1 .tag { right: 1vw; }
.role { position: absolute; top: 1.4vh; z-index: 3; padding: .3em .9em; border-radius: 99px; font-size: clamp(11px, 1.05vw, 18px); font-weight: 900; transition: opacity .2s; }
#s0 .role { right: 1vw; }
#s1 .role { left: 1vw; }
.role.atk { background: var(--frog); color: var(--olive); }
.role.def { background: #fff; color: var(--night); }
.role.off { opacity: 0; }

.frog { position: absolute; left: 50%; bottom: 5%; height: 82%; aspect-ratio: 240 / 300; transform: translateX(-50%); }
.frog .bob { width: 100%; height: 100%; transform-origin: 50% 100%; animation: jiggle 2.6s ease-in-out infinite; }
#s1 .frog .bob { animation-delay: -1.3s; }
@keyframes jiggle { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.02, .985); } }
.frog .body { width: 100%; height: 100%; transform-origin: 50% 100%; }
.frog svg { width: 100%; height: 100%; overflow: visible; }
.frog .laugh, .frog .hurt, .frog .guard, .frog .dizzy, .frog .print { opacity: 0; }
.frog.ouch .calm-face { opacity: 0; }
.frog.ouch .hurt { opacity: 1; }
.frog.guarding .guard { opacity: 1; }
.frog.guarding .arms { opacity: 0; }
.frog.dazed .dizzy { opacity: 1; }
.frog.dazed .pupils { opacity: 0; }
.frog.lol .calm-face, .frog.lol .hurt { opacity: 0; }
.frog.lol .laugh { opacity: 1; }
.frog.lol .body { animation: lol .16s linear infinite; }
@keyframes lol { 0% { transform: translate(0,0) rotate(0); } 25% { transform: translate(-1.5%,1%) rotate(-2deg) scale(1.02,.97); } 50% { transform: translate(0,2%) rotate(0) scale(.98,1.03); } 75% { transform: translate(1.5%,1%) rotate(2deg) scale(1.02,.97); } }
.frog.lol.bent .bob { transform: rotate(-8deg) translateY(2%); transition: transform .4s; animation: none; }
#s1 .frog.lol.bent .bob { transform: rotate(8deg) translateY(2%); }
.frog .print { transition: opacity 1.6s ease-in; }
.frog .print.show { opacity: .7; transition: none; }
.frog.glow svg { filter: drop-shadow(0 0 14px #fff); }

.stamp { position: absolute; top: 74%; z-index: 6; transform: translate(-50%, -50%) rotate(-14deg); pointer-events: none;
  width: clamp(80px, 9.5vw, 170px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  font: 900 clamp(36px, 4.8vw, 86px)/1 var(--ui); border: .4vw solid currentColor; }
#s0 .stamp { left: 22%; }
#s1 .stamp { left: 78%; }
.stamp.win { color: var(--frog); background: rgba(110,85,48,.55); text-shadow: 0 3px 0 var(--olive); }
.stamp.lose { color: #fff; background: rgba(26,20,48,.6); }

/* danmaku */
#danmaku { position: absolute; inset: 0; z-index: 7; pointer-events: none; overflow: hidden; border-radius: 20px; }
.dm { position: absolute; left: 100%; white-space: nowrap; font-weight: 900; font-size: clamp(15px, 1.7vw, 30px);
  -webkit-text-stroke: 1px rgba(0,0,0,.55); paint-order: stroke fill; text-shadow: 0 2px 3px rgba(0,0,0,.45); }
.dm.y { color: var(--frog-hi); }
.dm.big { font-size: clamp(20px, 2.4vw, 42px); }

/* gift banner */
.gift { position: absolute; z-index: 8; top: 9vh; display: flex; align-items: center; gap: .6vw; padding: .4vw 1.6vw .4vw .4vw; border-radius: 99px;
  background: linear-gradient(90deg, rgba(110,85,48,.92), rgba(110,85,48,.0)); white-space: nowrap; pointer-events: none; }
#s1 .gift { flex-direction: row-reverse; padding: .4vw .4vw .4vw 1.6vw; background: linear-gradient(270deg, rgba(110,85,48,.92), rgba(110,85,48,0)); }
#s0 .gift { left: .6vw; }
#s1 .gift { right: .6vw; }
.gift .avatar { width: clamp(30px, 3vw, 50px); box-shadow: 0 0 0 2px #fff; }
.gift .txt { font-size: clamp(11px, 1vw, 17px); line-height: 1.3; }
.gift .txt b { color: var(--frog); }
.gift .item { width: clamp(30px, 3vw, 52px); }
.gift .combo { font: italic clamp(26px, 3vw, 54px)/1 var(--num); color: var(--frog); -webkit-text-stroke: 2px var(--olive); paint-order: stroke fill; }
.gift .combo small { font-size: .5em; margin-right: .05em; }

/* call-outs */
#call { position: absolute; left: 0; right: 0; top: 30%; z-index: 9; text-align: center; pointer-events: none; }
#call .big { display: inline-block; padding: 0 .3em; font: 900 clamp(46px, 7.6vw, 140px)/1.05 var(--ui); color: var(--frog);
  -webkit-text-stroke: clamp(3px, .4vw, 8px) var(--olive); paint-order: stroke fill; text-shadow: 0 .45vw 0 var(--olive), 0 .8vw 1.4vw rgba(0,0,0,.35); }
#call .big.red { color: #ffe3ea; -webkit-text-stroke-color: #b0103a; text-shadow: 0 .45vw 0 #b0103a, 0 .8vw 1.4vw rgba(0,0,0,.35); }
#call .big.blue { color: #e5f0ff; -webkit-text-stroke-color: #1652c4; text-shadow: 0 .45vw 0 #1652c4, 0 .8vw 1.4vw rgba(0,0,0,.35); }
#call .big.grey { color: #f1eee6; -webkit-text-stroke-color: #5b5470; text-shadow: 0 .45vw 0 #5b5470; }
#call .sub { display: inline-block; margin-top: 1vh; padding: .3em 1.1em; border-radius: 99px; background: rgba(26,20,48,.7); font: clamp(13px, 1.4vw, 24px)/1.3 var(--soft); font-weight: 700; }

.dmg { position: fixed; z-index: 10; pointer-events: none; transform: translate(-50%, -50%); text-align: center;
  font: clamp(36px, 5vw, 92px)/1 var(--num); color: #fff; -webkit-text-stroke: clamp(2px, .3vw, 5px) var(--red); paint-order: stroke fill; text-shadow: 0 .3vw 0 #8a0d2c; }
.dmg.crit { color: var(--frog); -webkit-text-stroke-color: var(--olive); text-shadow: 0 .3vw 0 #3d2e18; }
.dmg small { display: block; font: 900 .34em/1.5 var(--ui); }
.pop { position: fixed; z-index: 10; pointer-events: none; font: 900 clamp(20px, 2.2vw, 40px)/1 var(--ui); color: #fff; -webkit-text-stroke: 2px var(--olive); paint-order: stroke fill; }
#hand { position: fixed; left: 0; top: 0; z-index: 9; width: clamp(60px, 7vw, 130px); aspect-ratio: 1; opacity: 0; pointer-events: none; }
#hand svg { width: 100%; height: 100%; overflow: visible; }
#flash { position: fixed; inset: 0; z-index: 30; background: #fff7d6; opacity: 0; pointer-events: none; }

/* idle + end */
#idle { position: absolute; inset: 0; z-index: 9; display: grid; place-content: center; text-align: center; pointer-events: none; }
#idle .t { font: 900 clamp(40px, 6.6vw, 124px)/1.05 var(--ui); color: var(--frog); -webkit-text-stroke: clamp(3px, .4vw, 8px) var(--olive); paint-order: stroke fill;
  text-shadow: 0 .5vw 0 var(--olive), 0 1vw 2vw rgba(0,0,0,.4); }
#idle .s { margin-top: 1.5vh; font: 700 clamp(14px, 1.6vw, 28px)/1.4 var(--soft); text-shadow: 0 2px 4px rgba(0,0,0,.6); }
#idle .go { display: inline-block; margin-top: 3vh; padding: .5em 1.6em; border-radius: 99px; background: var(--red); font-weight: 900; font-size: clamp(14px, 1.5vw, 26px);
  box-shadow: 0 .4vh 0 #9c0f33; animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 50% { transform: scale(1.06); } }
#end { position: absolute; inset: 0; z-index: 9; display: grid; place-content: center; text-align: center; pointer-events: none; }
#end .t { font: 900 clamp(48px, 8vw, 150px)/1 var(--ui); color: var(--frog); -webkit-text-stroke: clamp(3px, .45vw, 9px) var(--olive); paint-order: stroke fill;
  text-shadow: 0 .55vw 0 var(--olive), 0 1vw 2vw rgba(0,0,0,.45); }
#end .s { display: inline-block; margin-top: 2vh; padding: .45em 1.3em; border-radius: 99px; background: rgba(26,20,48,.8); font: 700 clamp(14px, 1.7vw, 30px)/1.35 var(--soft); }
#end .s b { font-family: var(--num); color: var(--frog); font-size: 1.25em; margin: 0 .15em; }
#end .again { margin-top: 2.5vh; font-weight: 700; font-size: clamp(12px, 1.2vw, 20px); opacity: .85; text-shadow: 0 2px 4px #000; }
.hidden { display: none !important; }

/* ---------- bottom ---------- */
#bottom { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1.5vw; align-items: end; }
#chat { display: flex; flex-direction: column; justify-content: flex-end; gap: .35vh; height: clamp(54px, 9vh, 110px); overflow: hidden; font-size: clamp(11px, .95vw, 16px);
  mask-image: linear-gradient(180deg, transparent, #000 35%); -webkit-mask-image: linear-gradient(180deg, transparent, #000 35%); }
.msg { align-self: flex-start; max-width: 100%; padding: .25em .75em; border-radius: 99px; background: rgba(255,255,255,.1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: up .25s ease-out; }
.msg .u { font-weight: 900; margin-right: .5em; }
.msg .u.p0 { color: #ff9db3; }
.msg .u.p1 { color: #93bcff; }
.msg .d { font-family: var(--num); opacity: .7; margin-left: .4em; }
@keyframes up { from { opacity: 0; transform: translateY(8px); } }
#buttons { display: flex; gap: .8vw; }
.btn { display: flex; flex-direction: column; align-items: center; gap: .4vh; background: none; border: 0; color: #fff; cursor: pointer; padding: 0; font-size: clamp(11px, .95vw, 16px); font-weight: 700; }
.btn .ic { flex: none; width: clamp(40px, 3.8vw, 64px); height: clamp(40px, 3.8vw, 64px); border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12);
  transition: transform .12s, background .15s; }
.btn .ic svg { width: 46%; height: 46%; }
.btn:hover .ic { background: rgba(255,255,255,.22); }
.btn.main .ic { background: var(--frog); box-shadow: 0 .35vh 0 var(--frog-lo); }
.btn.main .ic svg { color: var(--olive); }
.btn:active .ic, .btn.press .ic { transform: scale(.9); }
.btn:focus-visible .ic { outline: 3px solid #fff; outline-offset: 3px; }
.btn.off .ic { opacity: .5; }
#keys { justify-self: end; display: grid; grid-template-columns: auto repeat(6, auto); gap: .35vh .35vw; align-items: center; font-size: clamp(10px, .85vw, 14px); }
#keys .who { font-weight: 900; padding-right: .3vw; }
#keys .who.p0 { color: #ff9db3; }
#keys .who.p1 { color: #93bcff; }
#keys .k { display: flex; align-items: center; gap: .3em; padding: .2em .45em .2em .2em; border-radius: 99px; background: rgba(255,255,255,.08); white-space: nowrap; transition: background .1s; }
#keys .k kbd { display: inline-grid; place-items: center; width: 1.8em; height: 1.8em; border-radius: 50%; background: var(--belly); color: var(--olive); font: 1em/1 var(--num); }
#keys .k.hit { background: var(--frog); color: var(--olive); }
#keys .hint { grid-column: 1 / -1; text-align: right; opacity: .65; font-family: var(--soft); font-weight: 700; }
#toast { position: fixed; left: 50%; top: 2vh; transform: translateX(-50%); z-index: 40; padding: .45em 1.3em; border-radius: 99px; background: rgba(0,0,0,.75);
  font-size: clamp(12px, 1vw, 16px); opacity: 0; transition: opacity .3s; pointer-events: none; }
#toast.show { opacity: 1; }
#offline { position: fixed; top: 0; left: 0; right: 0; z-index: 50; text-align: center; background: var(--red); padding: .3em; font-size: 14px; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .frog .bob, .live.on::before, #idle .go { animation: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="g-body" cx="40%" cy="28%" r="80%"><stop offset="0" stop-color="#fff2a8"/><stop offset=".35" stop-color="#f6c933"/><stop offset=".8" stop-color="#e1a91c"/><stop offset="1" stop-color="#b98410"/></radialGradient>
    <radialGradient id="g-belly" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#fffaf0"/><stop offset=".6" stop-color="#fff1d6"/><stop offset="1" stop-color="#e9cf9c"/></radialGradient>
    <radialGradient id="g-eye" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#eef7d2"/><stop offset=".55" stop-color="#c9e39a"/><stop offset="1" stop-color="#8fbf5a"/></radialGradient>
    <radialGradient id="g-olive" cx="40%" cy="30%"><stop offset="0" stop-color="#94784a"/><stop offset="1" stop-color="#4f3c1f"/></radialGradient>
    <symbol id="palm" viewBox="-30 -40 60 70">
      <ellipse cx="0" cy="8" rx="17" ry="19"/>
      <ellipse cx="-14" cy="-20" rx="4.6" ry="13" transform="rotate(-14 -14 -20)"/>
      <ellipse cx="-4" cy="-26" rx="4.8" ry="14"/>
      <ellipse cx="6.5" cy="-25" rx="4.8" ry="13.5" transform="rotate(6 6.5 -25)"/>
      <ellipse cx="16" cy="-18" rx="4.4" ry="11.5" transform="rotate(16 16 -18)"/>
      <ellipse cx="-22" cy="10" rx="4.6" ry="11" transform="rotate(-50 -22 10)"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.1-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M4 3.5v5h5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div id="app">
  <div id="top">
    <div class="host p1" style="--c: var(--red)"><div class="avatar" id="av0"></div>
      <div class="who"><div class="name">奶蛙</div><div class="meta"><span class="live" id="live0">未连麦</span><span class="dev" id="dev0">SLAP-P1</span></div></div></div>
    <div id="pkbadge"><div class="pk">PK</div><div class="clock" id="clock">等待开局</div></div>
    <div class="host p2" style="--c: var(--blue)"><div class="avatar" id="av1"></div>

<script>
"use strict";
// Must match firmware/libraries/SlapCommon/src/slap_game_config.h
const ATTACK_TIMEOUT_MS = 5000;

const $ = (id) => document.getElementById(id);
const FROG = [{ name: "奶蛙", hat: false }, { name: "拿破蛙", hat: true }];
const CLS = { forehand: "正手", backhand: "反手", feint: "假动作", dodge_left: "左闪", dodge_right: "右闪", block: "格挡", background: "背景" };
const OUTCOME = {
  HIT:            { big: "啪！",       cls: "red",  dm: ["好响", "这一巴掌有回音", "啪！！", "听着都疼", "脸都打歪了"] },
  JUMPED:         { big: "抢跑了",     cls: "red",  dm: ["动太早了兄弟", "抢跑照吃", "急了急了"] },
  GRAZE:          { big: "擦到了",     cls: "grey", dm: ["闪反了哈哈", "方向错了", "擦边球"] },
  MISS:           { big: "闪开！",     cls: "blue", dm: ["闪现", "躲开了哈哈哈", "身法了得", "空气巴掌（物理）"] },
  BLOCKED:        { big: "挡住了",     cls: "blue", dm: ["稳", "防住了但没完全防住", "格挡！"] },
  COUNTERED:      { big: "反杀！",     cls: "",     dm: ["反杀！！", "攻守互换", "这波是反击", "节目效果拉满"] },
  FEINT_PUNISHED: { big: "骗到了！",   cls: "",     dm: ["被骗了哈哈哈", "假动作骗到真巴掌", "暴击！"] },
  FEINT_FOOLED:   { big: "上当了",     cls: "grey", dm: ["被假动作骗了", "下次别那么急"] },
  FEINT_HELD:     { big: "没上当",     cls: "blue", dm: ["稳住了", "不为所动"] },
  TIMEOUT:        { big: "时间到",     cls: "grey", dm: ["怎么不打", "犹豫就会败北", "换人换人"] },
};
const STRENGTH = { light: 0.55, medium: 0.8, heavy: 1.15 };
const STRENGTH_ZH = { light: "轻", medium: "", heavy: "痛击" };
// Keyboard play (web_dashboard.py --keys). Right-handed: a forehand is dodged to the right.
const KEYMAP = {
  KeyA: [0, "forehand"], KeyD: [0, "backhand"], KeyW: [0, "feint"], KeyQ: [0, "dodge_left"], KeyE: [0, "dodge_right"], KeyS: [0, "block"],
  KeyJ: [1, "forehand"], KeyL: [1, "backhand"], KeyI: [1, "feint"], KeyU: [1, "dodge_left"], KeyO: [1, "dodge_right"], KeyK: [1, "block"],
};
const S = { hp: [100, 100], round: 0, attacker: 0, state: "IDLE", deadline: 0, judging: false, over: false, mode: "referee",
            startedAt: 0, combo: [0, 0] };

/* ---------------- the frog (inner SVG shared by the stream panel and the avatars) ---------------- */
function frogInner(i) {
  const hat = FROG[i].hat ? `
    <g class="hat" transform="translate(120 34)">
      <path d="M-78 4 C-60 -30 -30 -44 0 -44 C30 -44 60 -30 78 4 C50 -8 -50 -8 -78 4 Z" fill="#1d1a2b" stroke="#000" stroke-width="2"/>
      <path d="M-74 2 C-48 -9 48 -9 74 2" fill="none" stroke="#d8b14a" stroke-width="4"/>
      <circle cx="-14" cy="-20" r="8" fill="#2f80ff" stroke="#fff" stroke-width="3"/><circle cx="-14" cy="-20" r="2.6" fill="#ff3b6b"/>
    </g>` : "";
  const flip = i === 1 ? 'transform="translate(240 0) scale(-1 1)"' : "";
  return `
    <g ${flip}>
      <ellipse cx="86" cy="286" rx="26" ry="11" fill="url(#g-olive)"/><ellipse cx="156" cy="286" rx="26" ry="11" fill="url(#g-olive)"/>
      <path d="M120 40 C168 40 186 86 188 128 C191 186 214 236 206 280 L34 280 C26 236 49 186 52 128 C54 86 72 40 120 40 Z" fill="url(#g-body)"/>
      <ellipse cx="120" cy="214" rx="64" ry="62" fill="url(#g-belly)"/>
      <ellipse cx="96" cy="78" rx="30" ry="20" fill="#fff" opacity=".35"/>
      <g class="arms">
        <path d="M54 150 C40 170 34 192 40 214" fill="none" stroke="url(#g-olive)" stroke-width="13" stroke-linecap="round"/>
        <path d="M186 150 C200 170 206 192 200 214" fill="none" stroke="url(#g-olive)" stroke-width="13" stroke-linecap="round"/>
      </g>
      <g class="guard">
        <path d="M58 150 C80 140 100 132 116 118" fill="none" stroke="url(#g-olive)" stroke-width="14" stroke-linecap="round"/>
        <path d="M182 150 C160 140 140 132 124 118" fill="none" stroke="url(#g-olive)" stroke-width="14" stroke-linecap="round"/>
        <circle cx="114" cy="112" r="14" fill="url(#g-olive)"/><circle cx="128" cy="116" r="14" fill="url(#g-olive)"/>
      </g>
      <g class="eyes">
        <circle cx="90" cy="54" r="27" fill="url(#g-body)"/><circle cx="150" cy="54" r="27" fill="url(#g-body)"/>
        <circle cx="90" cy="52" r="18" fill="url(#g-eye)" stroke="#6f9f3f" stroke-width="2.5"/>
        <circle cx="150" cy="52" r="18" fill="url(#g-eye)" stroke="#6f9f3f" stroke-width="2.5"/>
        <g class="pupils"><circle cx="92" cy="53" r="3.6" fill="#111"/><circle cx="148" cy="53" r="3.6" fill="#111"/></g>
        <g class="dizzy" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round">
          <path d="M90 52 m-8 0 a8 8 0 1 1 8 8 a5 5 0 1 1 -5 -5"/><path d="M150 52 m-8 0 a8 8 0 1 1 8 8 a5 5 0 1 1 -5 -5"/>
        </g>
        <circle cx="84" cy="45" r="4" fill="#fff" opacity=".8"/><circle cx="144" cy="45" r="4" fill="#fff" opacity=".8"/>
      </g>
      <g class="calm-face"><path d="M76 98 C100 106 140 106 164 98" fill="none" stroke="#8a5a1e" stroke-width="4.5" stroke-linecap="round"/></g>
      <g class="hurt"><path d="M86 108 C96 94 144 94 154 108 C140 102 100 102 86 108 Z" fill="#7a3d12" stroke="#5a2c0c" stroke-width="3"/>
        <path d="M70 70 l10 -6 M170 70 l-10 -6" stroke="#8a5a1e" stroke-width="3" stroke-linecap="round"/></g>
      <g class="laugh"><path d="M72 94 C90 92 150 92 168 94 C164 132 76 132 72 94 Z" fill="#6b2e0e" stroke="#4a1f08" stroke-width="3"/>
        <path d="M96 116 C108 126 132 126 144 116 C134 110 106 110 96 116 Z" fill="#e8567a"/>
        <path d="M76 95 L164 95" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9"/></g>
      <g class="print" fill="#e0233f"><use href="#palm" x="140" y="76" width="40" height="46" transform="rotate(18 160 99)"/></g>
    </g>
    ${hat}`;
}
function frogSVG(i) {
  return `<div class="bob"><div class="body"><svg viewBox="0 0 240 300">
    <ellipse cx="120" cy="292" rx="88" ry="10" fill="rgba(0,0,0,.18)"/>${frogInner(i)}</svg></div></div>`;
}
function avatarSVG(i) { return `<svg viewBox="40 0 160 140">${frogInner(i)}</svg>`; }   // head crop

/* ---------------- sound (synthesised, no files) ---------------- */
const Sfx = {
  ctx: null, muted: false,
  wake() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
    if (this.ctx.state === "suspended") this.ctx.resume();
  },
  ok() { return this.ctx && !this.muted && this.ctx.state === "running"; },
  gain(t, peak, dur) {
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(this.ctx.destination); return g;
  },
  noise(dur) {
    const c = this.ctx, n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = b; return s;
  },
  slap(k = 1) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime, n = this.noise(0.25), f = c.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = 1700; f.Q.value = 0.7; n.connect(f); f.connect(this.gain(t, 0.95 * k, 0.15)); n.start(t);
    const o = c.createOscillator(); o.type = "sine"; o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.18);
    o.connect(this.gain(t, 0.6 * k, 0.2)); o.start(t); o.stop(t + 0.25);
  },
  boing() {   // jelly body squash
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime, o = c.createOscillator();
    o.type = "sine"; o.frequency.setValueAtTime(320, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.25);
    o.connect(this.gain(t, 0.25, 0.3)); o.start(t); o.stop(t + 0.32);
  },
  whoosh(v = 0.3) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime, n = this.noise(0.4), f = c.createBiquadFilter();
    f.type = "bandpass"; f.Q.value = 1.6; f.frequency.setValueAtTime(350, t); f.frequency.exponentialRampToValueAtTime(2600, t + 0.28);
    n.connect(f); f.connect(this.gain(t, v, 0.3)); n.start(t);
  },
  ding(fr = 1046, when = 0, vol = 0.14) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + when, o = c.createOscillator();
    o.type = "triangle"; o.frequency.value = fr; o.connect(this.gain(t, vol, 0.5)); o.start(t); o.stop(t + 0.55);
  },
  gift() { this.ding(1318, 0); this.ding(1760, 0.08); },
  laugh(len = 2.2) {   // "哈哈哈" — breathy bursts riding a falling pitch
    if (!this.ok()) return;
    const c = this.ctx, t0 = c.currentTime;
    for (let k = 0, t = t0; t < t0 + len; k++, t += 0.13 + Math.random() * 0.03) {
      const o = c.createOscillator(), f = c.createBiquadFilter(), n = this.noise(0.12), nf = c.createBiquadFilter();
      const p = 330 - k * 6 + Math.random() * 30;
      o.type = "sawtooth"; o.frequency.setValueAtTime(p * 1.15, t); o.frequency.exponentialRampToValueAtTime(p, t + 0.09);
      f.type = "bandpass"; f.frequency.value = 900; f.Q.value = 3;
      o.connect(f); f.connect(this.gain(t, 0.22, 0.11)); o.start(t); o.stop(t + 0.12);
      nf.type = "bandpass"; nf.frequency.value = 2400; n.connect(nf); nf.connect(this.gain(t, 0.12, 0.08)); n.start(t);
    }
  },
};

/* ---------------- helpers ---------------- */
function frogBox(i) { const r = $("f" + i).getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top, w: r.width, h: r.height }; }
function cheekOf(i) { const b = frogBox(i); return { x: b.x + (i ? -1 : 1) * b.w * 0.2, y: b.y + b.h * 0.3 }; }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2200); }
function playerOf(name) { return /P2|DEF/.test(name) ? 1 : 0; }
const pick = (a) => a[Math.floor(Math.random() * a.length)];

function call(big, cls = "", sub = "", hold = 1100) {
  const a = $("call");
  a.innerHTML = "";
  const b = document.createElement("div"); b.className = "big " + cls; b.textContent = big; a.appendChild(b);
  if (sub) { const s = document.createElement("div"); const sp = document.createElement("span"); sp.className = "sub"; sp.textContent = sub; s.appendChild(sp); a.appendChild(s); }
  b.animate([{ transform: "scale(.3) rotate(-8deg)", opacity: 0 }, { transform: "scale(1.12) rotate(3deg)", opacity: 1, offset: 0.55 }, { transform: "scale(1) rotate(0)", opacity: 1 }],
    { duration: 380, easing: "cubic-bezier(.3,1.6,.5,1)", fill: "forwards" });
  clearTimeout(call.h);
  call.h = setTimeout(() => { a.animate([{ opacity: 1 }, { opacity: 0, transform: "translateY(-2vh)" }], { duration: 250, fill: "forwards" })
    .onfinish = () => { if (a.firstChild === b) a.innerHTML = ""; a.getAnimations().forEach(x => x.cancel()); }; }, hold);
}

function danmaku(text, opts = {}) {
  const layer = $("danmaku"), d = document.createElement("div");
  d.className = "dm" + (opts.y ? " y" : "") + (opts.big ? " big" : "");
  d.textContent = text;
  const lanes = 8, lane = opts.lane ?? Math.floor(Math.random() * lanes);
  d.style.top = (4 + lane * (88 / lanes)) + "%";
  layer.appendChild(d);
  const w = layer.clientWidth + d.clientWidth;
  d.animate([{ transform: "translateX(0)" }, { transform: `translateX(${-w}px)` }],
    { duration: (opts.speed || 5200) + Math.random() * 1600, delay: opts.delay || 0, easing: "linear" }).onfinish = () => d.remove();
}
function crowd(lines, n = 3) { for (let k = 0; k < n; k++) danmaku(pick(lines), { delay: k * 260, y: Math.random() < 0.3 }); }

function chat(user, text, data, p) {
  const box = $("chat"), m = document.createElement("div");
  m.className = "msg";
  m.innerHTML = `<span class="u p${p}">${user}</span>${text}${data ? `<span class="d">${data}</span>` : ""}`;
  box.appendChild(m);
  while (box.children.length > 3) box.firstChild.remove();
}

function setHp(hp, animate = true) {
  const a = Math.max(0, hp[0]), b = Math.max(0, hp[1]), share = a + b ? (a / (a + b)) * 100 : 50;
  const r = document.querySelector("#pk .r"), bl = document.querySelector("#pk .b"), v = document.querySelector("#pk .v");
  if (!animate) r.style.transition = bl.style.transition = v.style.transition = "none";
  r.style.width = share + "%"; bl.style.width = (100 - share) + "%"; v.style.left = Math.min(97, Math.max(3, share)) + "%";   // knob stays on screen
  if (!animate) { void r.offsetWidth; r.style.transition = bl.style.transition = v.style.transition = ""; }
  $("pkn0").innerHTML = `<small>绷住值</small>${a}`; $("pkn1").innerHTML = `${b}<small>绷住值</small>`;
  S.hp = hp.slice();
}

function setRoles() {
  const show = !S.over && S.state !== "IDLE" && S.round > 0;
  for (const i of [0, 1]) {
    const r = $("role" + i), atk = i === S.attacker;
    r.textContent = atk ? "出手" : "防守";
    r.className = "role " + (atk ? "atk" : "def") + (show ? "" : " off");
  }
}

function shake(k) {
  const px = 4 + 16 * k;
  $("streams").animate([{ transform: "translate(0,0)" }, { transform: `translate(${-px}px,${px * .3}px)` }, { transform: `translate(${px * .7}px,${-px * .4}px)` },
    { transform: `translate(${-px * .4}px,${px * .2}px)` }, { transform: "translate(0,0)" }], { duration: 240 + 180 * k, easing: "ease-out" });
}
function flash(v = 0.5) { $("flash").animate([{ opacity: v }, { opacity: 0 }], { duration: 280, easing: "ease-out" }); }

function popText(x, y, text) {
  const p = document.createElement("div"); p.className = "pop"; p.textContent = text;
  p.style.left = x + "px"; p.style.top = y + "px"; document.body.appendChild(p);
  const dx = (Math.random() - 0.5) * 120;
  p.animate([{ transform: "translate(-50%,-50%) scale(.4)", opacity: 0 }, { transform: `translate(calc(-50% + ${dx * .4}px),-110%) scale(1.1)`, opacity: 1, offset: .3 },
    { transform: `translate(calc(-50% + ${dx}px),-260%) scale(1)`, opacity: 0 }], { duration: 1100, easing: "ease-out" }).onfinish = () => p.remove();
}

function popDamage(i, dmg, label, crit) {
  if (!dmg) return;
  const b = frogBox(i), d = document.createElement("div");
  d.className = "dmg" + (crit ? " crit" : "");
  d.innerHTML = `−${dmg}${label ? `<small>${label}</small>` : ""}`;
  d.style.left = b.x + (i ? 1 : -1) * b.w * 0.55 + "px"; d.style.top = b.y + b.h * 0.18 + "px";
  document.body.appendChild(d);
  d.animate([{ transform: "translate(-50%,-30%) scale(.4)", opacity: 0 }, { transform: "translate(-50%,-60%) scale(1.2)", opacity: 1, offset: .2 },
    { transform: "translate(-50%,-90%) scale(1)", opacity: 1, offset: .7 }, { transform: "translate(-50%,-150%) scale(.95)", opacity: 0 }],
    { duration: 1300, easing: "ease-out" }).onfinish = () => d.remove();
}

function gift(atk, label, strength) {
  S.combo[atk] += 1; S.combo[atk ^ 1] = 0;
  const panel = $("s" + atk);
  panel.querySelectorAll(".gift").forEach(g => g.remove());
  const g = document.createElement("div");
  g.className = "gift";
  g.innerHTML = `<div class="avatar" style="--c:#fff">${avatarSVG(atk)}</div>
    <div class="txt"><b>${FROG[atk].name}</b><br>送出 ${label}</div>
    <svg class="item" viewBox="-40 -50 80 95"><use href="#palm" x="-30" y="-40" width="60" height="70" fill="${strength === "heavy" ? "#ff3b6b" : "#f6c933"}" stroke="#6e5530" stroke-width="3"/></svg>
    <div class="combo"><small>×</small>${S.combo[atk]}</div>`;
  panel.appendChild(g);
  const dir = atk ? 1 : -1;
  g.animate([{ transform: `translateX(${dir * 60}%)`, opacity: 0 }, { transform: "translateX(0)", opacity: 1, offset: .15 }, { transform: "translateX(0)", opacity: 1, offset: .85 }, { opacity: 0 }],
    { duration: 2400, easing: "ease-out", fill: "forwards" }).onfinish = () => g.remove();
  g.querySelector(".combo").animate([{ transform: "scale(2)" }, { transform: "scale(1)" }], { duration: 300, easing: "cubic-bezier(.3,1.6,.5,1)" });
  Sfx.gift();
}

// Olive-brown hand reaches across the split screen to the other frog's cheek. Returns ms to contact.
function swing(from, to, connects = true) {
  const h = $("hand"), a = frogBox(from), b = cheekOf(to);
  const hw = h.getBoundingClientRect().width || 100, dir = to > from ? 1 : -1;
  const x0 = a.x + dir * a.w * 0.3 - hw / 2, x1 = b.x - dir * hw * (connects ? 0.15 : -1.2) - hw / 2, y = b.y - hw / 2;
  h.animate([
    { transform: `translate(${x0}px,${y - hw * .4}px) rotate(${-55 * dir}deg) scaleX(${dir})`, opacity: 0 },
    { transform: `translate(${x0}px,${y - hw * .3}px) rotate(${-45 * dir}deg) scaleX(${dir})`, opacity: 1, offset: .15 },
    { transform: `translate(${x1}px,${y}px) rotate(${8 * dir}deg) scaleX(${dir})`, opacity: 1, offset: .58 },
    { transform: `translate(${x1 + dir * hw * .7}px,${y + hw * .15}px) rotate(${28 * dir}deg) scaleX(${dir})`, opacity: 0 },
  ], { duration: 360, easing: "cubic-bezier(.5,0,.6,1)" });
  return 210;
}

function squash(i, k) {   // jelly recoil away from the slap
  const f = $("f" + i), body = f.querySelector(".body"), dir = i === 1 ? 1 : -1;
  body.animate([
    { transform: "none" },
    { transform: `translateX(${dir * 10 * k}%) rotate(${dir * 14 * k}deg) scale(${1 - .14 * k},${1 + .1 * k})`, offset: .1 },
    { transform: `translateX(${-dir * 4 * k}%) rotate(${-dir * 6 * k}deg) scale(${1 + .1 * k},${1 - .1 * k})`, offset: .35 },
    { transform: `rotate(${dir * 3 * k}deg) scale(${1 - .04 * k},${1 + .04 * k})`, offset: .6 },
    { transform: "none" },
  ], { duration: 800 + 300 * k, easing: "cubic-bezier(.2,.9,.3,1)" });
  f.classList.remove("ouch"); void f.offsetWidth; f.classList.add("ouch");
  clearTimeout(f.ouchH); f.ouchH = setTimeout(() => f.classList.remove("ouch"), 1000);
  const p = f.querySelector(".print"); p.classList.add("show"); void p.getBoundingClientRect(); setTimeout(() => p.classList.remove("show"), 900);
  Sfx.boing();
}

function dodge(i, cls) {
  const body = $("f" + i).querySelector(".body"), dir = cls === "dodge_left" ? -1 : 1;
  body.animate([{ transform: "none" }, { transform: `translateX(${dir * 30}%) rotate(${dir * 18}deg) scale(.9,1.08)`, offset: .2 },
    { transform: `translateX(${dir * 26}%) rotate(${dir * 14}deg)`, offset: .6 }, { transform: "none" }], { duration: 720, easing: "cubic-bezier(.2,.9,.3,1)" });
}
function guard(i) {
  const f = $("f" + i); f.classList.add("guarding"); clearTimeout(f.gH); f.gH = setTimeout(() => f.classList.remove("guarding"), 900);
  f.querySelector(".body").animate([{ transform: "none" }, { transform: "scale(1.06,.94)", offset: .3 }, { transform: "none" }], { duration: 500 });
}
function daze(i) {
  const f = $("f" + i); f.classList.add("dazed"); clearTimeout(f.dH); f.dH = setTimeout(() => f.classList.remove("dazed"), 1300);
  f.querySelector(".body").animate([{ transform: "none" }, { transform: "rotate(-6deg)" }, { transform: "rotate(6deg)" }, { transform: "rotate(-4deg)" }, { transform: "none" }], { duration: 900 });
}

function impact(def, k, crit) {
  squash(def, k);
  const c = cheekOf(def);
  popText(c.x, c.y, pick(["啪", "啪！", "PIA"]));
  shake(k); Sfx.slap(k);
  if (k >= 1 || crit) flash(crit ? 0.55 : 0.35);
}

/* ---------------- referee messages ---------------- */
function onResult(m, animate) {
  const atk = m.attacker, def = atk ^ 1, k = STRENGTH[m.strength] || 0.8;
  const o = OUTCOME[m.outcome] || { big: m.outcome, cls: "", dm: [] };
  if (!animate) { setHp(m.hp, false); return; }
  const delta = m.delta_ms ? `反应 ${m.delta_ms} ms` : "";
  const hitLabel = (STRENGTH_ZH[m.strength] || "") + "巴掌";
  switch (m.outcome) {
    case "HIT": case "JUMPED": {
      const t = swing(atk, def);
      setTimeout(() => { impact(def, k, false); setHp(m.hp); popDamage(def, m.damage, m.strength === "heavy" ? "痛击" : ""); }, t);
      gift(atk, hitLabel, m.strength);
      call(m.strength === "heavy" && m.outcome === "HIT" ? "痛击！" : o.big, o.cls, m.outcome === "JUMPED" ? `${FROG[def].name}动得太早，照吃` : delta);
      break;
    }
    case "FEINT_PUNISHED": {
      const t = swing(atk, def);
      setTimeout(() => { impact(def, 1.2, true); setHp(m.hp); popDamage(def, m.damage, "暴击", true); }, t);
      gift(atk, "假动作+真巴掌", "heavy");
      call(o.big, o.cls, `${FROG[def].name}信了假动作`);
      break;
    }
    case "GRAZE": {
      dodge(def, m.defense);
      const t = swing(atk, def);
      setTimeout(() => { impact(def, 0.4, false); setHp(m.hp); popDamage(def, m.damage, "擦到"); }, t);
      call(o.big, o.cls, "闪反方向了，扣一半");
      break;
    }
    case "BLOCKED": {
      const t = swing(atk, def);
      setTimeout(() => { guard(def); Sfx.slap(0.35); shake(0.25); setHp(m.hp); popDamage(def, m.damage, "格挡"); }, t);
      call(o.big, o.cls, "伤害减半，不能反击");
      break;
    }
    case "MISS": {
      dodge(def, m.defense); swing(atk, def, false); Sfx.whoosh();
      call(o.big, o.cls, delta ? `${delta}，可以反击` : "");
      break;
    }
    case "COUNTERED": {
      dodge(def, m.defense); swing(atk, def, false); Sfx.whoosh();
      setTimeout(() => {
        const t = swing(def, atk);
        setTimeout(() => { impact(atk, 1.1, true); setHp(m.hp); popDamage(atk, m.counter_damage, "反击", true); }, t);
        gift(def, "反击巴掌", "heavy");
      }, 440);
      call(o.big, o.cls, `${FROG[def].name}闪开后反手一巴掌`, 1500);
      break;
    }
    case "FEINT_FOOLED": case "FEINT_HELD":
      daze(def); setHp(m.hp); Sfx.whoosh(0.15); call(o.big, o.cls, m.outcome === "FEINT_FOOLED" ? "下回合防守时间变短" : "");
      break;
    default:
      setHp(m.hp); Sfx.ding(392, 0, 0.12); Sfx.ding(330, 0.14, 0.12); call(o.big, o.cls, "换人");
  }
  crowd(o.dm, m.outcome === "COUNTERED" || m.strength === "heavy" ? 5 : 3);
}

function onGameOver(m, animate) {
  S.over = true;
  setHp(m.hp, animate);
  const loser = m.winner ^ 1, secs = S.startedAt ? Math.round((performance.now() - S.startedAt) / 1000) : null;
  const show = () => {
    const lf = $("f" + loser);
    lf.classList.add("lol"); setTimeout(() => lf.classList.add("bent"), 1800);
    for (const i of [0, 1]) {
      const st = document.createElement("div");
      st.className = "stamp " + (i === m.winner ? "win" : "lose"); st.textContent = i === m.winner ? "胜" : "败";
      $("s" + i).appendChild(st);
      if (animate) st.animate([{ transform: "translate(-50%,-50%) rotate(-14deg) scale(2.4)", opacity: 0 }, { transform: "translate(-50%,-50%) rotate(-14deg) scale(1)", opacity: 1 }],
        { duration: 320, delay: i === m.winner ? 0 : 160, easing: "cubic-bezier(.3,1.5,.5,1)", fill: "backwards" });
    }
    $("endline").innerHTML = secs != null
      ? `${FROG[m.winner].name}在绷不住大赛中坚持了<b>${secs}</b>秒`
      : `${FROG[m.winner].name}绷住了，${FROG[loser].name}没绷住`;
    $("end").classList.remove("hidden");
    if (animate) {
      $("end").querySelector(".t").animate([{ transform: "scale(.2) rotate(-10deg)", opacity: 0 }, { transform: "scale(1.1) rotate(2deg)", opacity: 1, offset: .6 }, { transform: "scale(1)", opacity: 1 }],
        { duration: 600, easing: "cubic-bezier(.3,1.6,.5,1)", fill: "forwards" });
      flash(0.6); shake(1.1); Sfx.laugh(2.6);
      for (let k = 0; k < 14; k++) danmaku(pick(["哈哈哈哈哈哈", "绷不住了", "笑死", "哈哈哈哈哈哈哈哈", "蛙已经笑疯了", "我也绷不住了"]), { delay: k * 180, y: k % 3 === 0, big: k % 4 === 0, speed: 4200 });
    }
    setRoles();
  };
  if (animate) setTimeout(show, 900); else show();
}

function resetBoard() {
  S.over = false; S.round = 0; S.deadline = 0; S.combo = [0, 0];
  $("end").classList.add("hidden");
  document.querySelectorAll(".stamp, .gift").forEach(e => e.remove());
  for (const i of [0, 1]) $("f" + i).classList.remove("lol", "bent", "ouch", "guarding", "dazed");
  setHp([100, 100], false);
}

function handle(m, animate = true) {
  switch (m.type) {
    case "peer": {
      const i = playerOf(m.name), live = $("live" + i), was = live.classList.contains("on");
      live.classList.toggle("on", !!m.connected); live.textContent = m.connected ? "连麦中" : "未连麦";
      $("dev" + i).textContent = m.name;
      if (animate && was !== !!m.connected) toast(`${FROG[i].name}${m.connected ? "连上麦了" : "掉线了"}（${m.name}）`);
      break;
    }
    case "state":
      S.state = m.state;
      if (m.state === "IDLE") resetBoard();
      if (m.state === "ARMED" && !S.deadline) S.deadline = performance.now() + ATTACK_TIMEOUT_MS;
      S.judging = m.state === "JUDGING";
      if (m.state !== "ARMED" && m.state !== "JUDGING") S.deadline = 0;
      $("idle").classList.toggle("hidden", m.state !== "IDLE");
      setRoles();
      break;
    case "announce":
      if (m.round === 1) { resetBoard(); S.startedAt = performance.now(); }
      S.round = m.round; S.attacker = m.attacker; S.deadline = 0;
      $("idle").classList.add("hidden");
      setRoles();
      if (animate) {
        call(`第 ${m.round} 回合`, "", `${FROG[m.attacker].name}出手`, 1000);
        if (m.round === 1) { Sfx.ding(784); Sfx.ding(1046, .12); danmaku("开打了开打了", { y: true }); danmaku("前排围观", { delay: 400 }); }
        else Sfx.ding(880);
      }
      break;
    case "result": onResult(m, animate); break;
    case "game_over": onGameOver(m, animate); break;
    case "event": if (animate) addEvent(m); break;
    case "snapshot":
      setMode(m.mode || "referee");
      for (const x of m.items) handle(x, false);
      break;
  }
}

function addEvent(m) {
  const i = playerOf(m.from);
  chat(FROG[i].name, CLS[m.cls] || m.cls, `${Math.round((m.conf / 255) * 100)}% · ${m.peak}°/s · 延迟 ${m.rx - m.t} ms`, i);
  const f = $("f" + i); f.classList.add("glow"); clearTimeout(f.glowH); f.glowH = setTimeout(() => f.classList.remove("glow"), 220);
  if (m.cls === "forehand" || m.cls === "backhand" || m.cls === "feint") Sfx.whoosh(0.12);
}

/* ---------------- PK clock ---------------- */
function tick() {
  const b = $("pkbadge"), c = $("clock");
  if (S.deadline) {
    const left = Math.max(0, S.deadline - performance.now());
    b.classList.toggle("urgent", left < 1500 && !S.judging);
    c.innerHTML = S.judging ? `第 ${S.round} 回合 · 判定中` : `${FROG[S.attacker].name}出手 <b>${(left / 1000).toFixed(1)}</b> 秒`;
  } else {
    b.classList.remove("urgent");
    c.textContent = S.over ? "本场结束" : S.state === "IDLE" ? "等待开局" : S.round ? `第 ${S.round} 回合` : "准备";
  }
  requestAnimationFrame(tick);
}

/* ---------------- keyboard play ---------------- */
function setMode(mode) {
  S.mode = mode;
  $("keys").classList.toggle("hidden", mode !== "keys");
  $("gohint").textContent = mode === "keys" ? "按空格开局 · 两人一台键盘" : "按空格开局";
}
function buildLegend() {
  const label = { feint: "假动作", forehand: "正手", backhand: "反手", dodge_left: "左闪", block: "格挡", dodge_right: "右闪" };
  const box = $("keys");
  for (const i of [0, 1]) {
    const w = document.createElement("div"); w.className = "who p" + i; w.textContent = FROG[i].name; box.appendChild(w);
    for (const cls of ["feint", "forehand", "backhand", "dodge_left", "block", "dodge_right"]) {
      const code = Object.keys(KEYMAP).find(c => KEYMAP[c][0] === i && KEYMAP[c][1] === cls);
      const d = document.createElement("div"); d.className = "k"; d.id = "k-" + code;
      d.innerHTML = `<kbd>${code.slice(3)}</kbd>${label[cls]}`; box.appendChild(d);
    }
  }
  const h = document.createElement("div"); h.className = "hint"; h.textContent = "按住 Shift 痛击，Alt 轻打；正手往右闪，反手往左闪"; box.appendChild(h);
}
function keyAction(e) {
  const k = KEYMAP[e.code];
  if (!k || S.mode !== "keys") return false;
  const [p, cls] = k, peak = e.shiftKey ? 900 : e.altKey ? 250 : 550;   // PEAK_*_DPS tiers: heavy / light / medium
  send(`ev ${p} ${cls} ${peak}`, true);
  const cap = $("k-" + e.code); if (cap) { cap.classList.add("hit"); setTimeout(() => cap.classList.remove("hit"), 160); }
  return true;
}

/* ---------------- commands ---------------- */
async function send(cmd, quiet = false) {
  Sfx.wake();
  try {
    const r = await fetch("/cmd", { method: "POST", body: cmd });
    if (r.status === 409 && !quiet) toast("这个数据来源不接受指令（stdin / 回放）");
  } catch (e) { if (!quiet) toast("指令没送出去：web_dashboard.py 有在跑吗？"); }
}
document.querySelectorAll("[data-cmd]").forEach(b => b.addEventListener("click", () => send(b.dataset.cmd)));
function toggleMute() { Sfx.wake(); Sfx.muted = !Sfx.muted; $("mute").classList.toggle("off", Sfx.muted); $("mute").querySelector(".lb").textContent = Sfx.muted ? "已静音" : "音效"; }
function toggleFs() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
function press(sel) { const t = document.querySelector(sel); if (t) { t.classList.add("press"); setTimeout(() => t.classList.remove("press"), 120); } }
$("mute").addEventListener("click", toggleMute);
$("fs").addEventListener("click", toggleFs);
document.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (keyAction(e)) { e.preventDefault(); return; }
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); press("[data-cmd=start]"); send("start"); }
  else if (e.code === "KeyR") { press("[data-cmd=reset]"); send("reset"); }
  else if (e.code === "KeyM") { press("#mute"); toggleMute(); }
  else if (e.code === "KeyF") { press("#fs"); toggleFs(); }
});
document.addEventListener("keyup", (e) => { if (e.key === "Alt") e.preventDefault(); });   // keep Alt from opening the browser menu
document.addEventListener("pointerdown", () => Sfx.wake(), { once: true });

/* ---------------- stream ---------------- */
function connect() {
  const es = new EventSource("/events");
  es.onopen = () => $("offline").classList.add("hidden");
  es.onmessage = (ev) => { try { handle(JSON.parse(ev.data)); } catch (err) { console.error(err, ev.data); } };
  es.onerror = () => $("offline").classList.remove("hidden");
}
for (const i of [0, 1]) { $("f" + i).innerHTML = frogSVG(i); $("av" + i).innerHTML = avatarSVG(i); }
buildLegend();
setHp([100, 100], false);
requestAnimationFrame(tick);
connect();
</script>
</body>
</html>

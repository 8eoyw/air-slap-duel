<!doctype html>
<html lang="zh-CN" data-theme="c">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空气巴掌 · 绷不住大赛</title>
<!--
  Served by tools/web_dashboard.py; listens to /events (SSE), posts commands to /cmd.
  No external assets: fonts and characters are local, so it works offline at the demo.

  A fixed 1920×1080 stage scaled to the window (desktop or projector, no phone layout).
  Three art directions over the same DOM, switched with T:
    a 午夜决斗  black #0b0a09, warm spot #ffeccd · Noto Serif SC + Cormorant italic · letterbox HUD, hairline bars
    b 拳赛海报  paper #efe6d2, vermilion #e4412a, ink #1f2a5a · ZCOOL QingKe + Anton · halftone discs, misregistered print
    c 玩具展台  backdrop colour = what just happened (cobalt, tomato, emerald, cream) · Noto Sans SC + Archivo · type behind the toys

  Characters are key poses from tools/gen_chars.py. Motion is pose-to-pose: a pose swap plus a fast move and a held
  frame on contact, like a fighting game, rather than video. chars/manifest.json says which poses exist; a missing
  pose falls back along FALLBACK, so new art only needs a reload.
-->
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root { --ui: "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC", sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: var(--ui); user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.hidden { display: none !important; }

#view { position: fixed; inset: 0; display: grid; place-items: center; }
#fit { overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: var(--bg); color: var(--fg); }
.set { position: absolute; inset: 0; display: none; }
.set i { position: absolute; display: block; }
[data-theme=a] .set.a, [data-theme=b] .set.b, [data-theme=c] .set.c { display: block; }

/* ---------- fighters: stacked poses, one visible, so a swap never waits on decoding ---------- */
.fighter { position: absolute; bottom: var(--floor); width: 0; height: 0; z-index: 5; }
.fighter.p0 { left: var(--x0); }
.fighter.p1 { left: var(--x1); }
.fighter .body { position: absolute; left: 0; bottom: 0; width: 0; height: 0; transform-origin: 0 0; animation: breathe 3.2s ease-in-out infinite; }
.fighter.p1 .body { animation-delay: -1.6s; }
@keyframes breathe { 50% { transform: scale(1.012, .99); } }
.fighter img { position: absolute; bottom: 0; left: 0; height: calc(var(--h) * var(--k, 1)); max-width: none; opacity: 0; pointer-events: none; transform: translateX(-50%); }
.fighter.p1 img { transform: translateX(-50%) scaleX(-1); }
.fighter img.on { opacity: 1; }
.fighter.lol .body { animation: lol .17s linear infinite; }
@keyframes lol { 25% { transform: translate(-7px, 3px) rotate(-1.4deg); } 75% { transform: translate(7px, 3px) rotate(1.4deg); } }

/* ---------- things every direction restyles ---------- */
#hud { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
.side, .mid { position: absolute; }
.bar { position: relative; }
.bar i { position: absolute; top: 0; bottom: 0; left: 0; width: var(--v, 100%); transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.side.p1 .bar i { left: auto; right: 0; }
.ticks { display: none; }
.num, .who, .round, .clock, #sensor, #call .zh, #call .en, #title .zh { white-space: nowrap; }
.link.off { color: #ff5a4f; opacity: 1; }
.role { opacity: 0; transition: opacity .2s; }
.role.show { opacity: 1; }

#call { position: absolute; left: 0; right: 0; pointer-events: none; text-align: center; }
#call .zh, #call .en, #call .sub, #title .zh, #title .en { display: block; }
#title { position: absolute; left: 0; right: 0; pointer-events: none; text-align: center; }
#sensor { position: absolute; z-index: 11; pointer-events: none; }
.dmg { position: absolute; z-index: 9; pointer-events: none; transform: translate(-50%, -50%); white-space: nowrap; }
.burst { position: absolute; z-index: 8; width: 420px; height: 420px; margin: -210px 0 0 -210px; pointer-events: none; opacity: 0;
  clip-path: polygon(50% 0, 58% 34%, 86% 12%, 68% 42%, 100% 50%, 68% 58%, 86% 88%, 58% 66%, 50% 100%, 42% 66%, 14% 88%, 32% 58%, 0 50%, 32% 42%, 14% 12%, 42% 34%); }
#flash { position: absolute; inset: 0; z-index: 20; opacity: 0; pointer-events: none; background: var(--flash, #fff); }

/* roster, under each fighter while nobody is playing */
.pick { position: absolute; z-index: 12; display: flex; gap: 10px; transform: translateX(-50%); }
.pick.p0 { left: var(--x0); }
.pick.p1 { left: var(--x1); }
.pick button { width: 66px; height: 74px; display: grid; place-items: end center; opacity: .5; border-bottom: 4px solid transparent; transition: opacity .15s; }
.pick button:hover { opacity: .85; }
.pick button.on { opacity: 1; border-bottom-color: var(--fg); }
.pick img { max-width: 58px; max-height: 66px; }
#stage:not(.waiting) .pick { display: none; }

/* the buttons only exist while the mouse moves; the key legend while waiting, or on H */
#dock { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 10px; }
#stage:not(.mouse) #btns { display: none; }
#stage:not(.waiting):not(.legend) #keys { display: none; }
#btns { display: flex; gap: 6px; padding: 6px; background: rgba(12, 12, 16, .78); }
#btns button { padding: 8px 15px; color: #f3f1ea; font-size: 21px; font-weight: 500; }
#btns button:hover { background: rgba(255, 255, 255, .14); }
#btns button kbd { font: inherit; opacity: .55; margin-left: .4em; }
#btns button.off { opacity: .5; }
#keys { display: grid; grid-template-columns: auto repeat(6, auto); gap: 4px 14px; padding: 10px 16px; background: rgba(12, 12, 16, .78); color: #f3f1ea; font-family: var(--ui); font-size: 21px; font-weight: 500; white-space: nowrap; }
#keys b { font-weight: 900; }
#keys .k { transition: color .1s; }
#keys .k.hit { color: #ffd23f; }
#keys kbd { font: 900 21px "Archivo", var(--ui); margin-right: .3em; }
#keys .hint { grid-column: 1 / -1; opacity: .65; }
#toast { position: absolute; left: 50%; top: 130px; transform: translateX(-50%); z-index: 40; padding: 10px 26px; background: rgba(12, 12, 16, .85); color: #f3f1ea; font-size: 24px; opacity: 0; transition: opacity .3s; pointer-events: none; }
#toast.show { opacity: 1; }
#offline { position: absolute; top: 0; left: 0; right: 0; z-index: 50; padding: 8px; text-align: center; background: #e4412a; color: #fff; font-size: 22px; font-weight: 500; }

/* ---------- a 午夜决斗: the slap, shot like an art film ---------- */
[data-theme=a] { --bg: #0b0a09; --fg: #f3ead9; --flash: #fff; --floor: 232px; --h: 560px; --x0: 560px; --x1: 1360px; }
[data-theme=a] #stage { font-family: "Noto Serif SC", "Songti SC", SimSun, serif; }
[data-theme=a] .fighter { filter: contrast(1.06) saturate(.9) brightness(.94); transition: filter .4s; }
[data-theme=a] .fighter img { -webkit-box-reflect: below 0 linear-gradient(transparent 76%, rgba(255, 255, 255, .2)); }
.a .spot { top: 60px; bottom: 96px; width: 900px; margin-left: -450px; filter: blur(30px); transition: opacity .35s; }
.a .spot::before { content: ""; position: absolute; inset: 0; clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%); background: linear-gradient(180deg, rgba(255, 236, 205, .22), rgba(255, 236, 205, .04)); }
.a .pool { bottom: 170px; width: 760px; height: 120px; margin-left: -380px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 236, 205, .2), transparent); transition: opacity .35s; }
.a .s0 { left: var(--x0); }
.a .s1 { left: var(--x1); }
.a .lb { left: 0; right: 0; height: 96px; background: #000; }
.a .lb.t { top: 0; }
.a .lb.b { bottom: 0; }
[data-atk="0"][data-beat=armed] .a .s1, [data-atk="1"][data-beat=armed] .a .s0, [data-loser="1"] .a .s0, [data-loser="0"] .a .s1 { opacity: .12; }
[data-theme=a] [data-loser="1"] .fighter.p0, [data-theme=a] [data-loser="0"] .fighter.p1 { filter: brightness(.26) saturate(.5); }
[data-theme=a] .side { top: 0; height: 96px; width: 620px; display: flex; align-items: center; gap: 22px; }
[data-theme=a] .side.p0 { left: 72px; }
[data-theme=a] .side.p1 { right: 72px; flex-direction: row-reverse; }
[data-theme=a] .who { font-weight: 500; font-size: 32px; letter-spacing: .3em; }
[data-theme=a] .num { font: italic 500 46px/1 "Cormorant Garamond", serif; min-width: 64px; text-align: center; }
[data-theme=a] .bar { flex: 1; height: 2px; background: #3a342c; }
[data-theme=a] .bar i { background: var(--fg); }
[data-theme=a] .meta { display: none; }
[data-theme=a] .role { font-size: 24px; color: #b9ae9c; }
[data-theme=a] .mid { top: 0; left: 0; right: 0; height: 96px; display: flex; align-items: center; justify-content: center; gap: 18px; }
[data-theme=a] .title { display: none; }
[data-theme=a] .round { font-size: 25px; letter-spacing: .2em; color: #b9ae9c; }
[data-theme=a] .clock { font: italic 500 40px/1 "Cormorant Garamond", serif; min-width: 56px; }
[data-theme=a] .urgent .clock { color: #ff6a4d; }
[data-theme=a] #sensor { left: 0; right: 0; bottom: 0; height: 96px; display: flex; align-items: center; justify-content: center; font-size: 26px; letter-spacing: .06em; color: #b9ae9c; }
[data-theme=a] #call { top: 300px; z-index: 8; text-shadow: 0 0 40px rgba(0, 0, 0, .7); }
[data-theme=a] #call .zh { font-weight: 900; font-size: min(190px, calc(1400px / var(--n, 2))); letter-spacing: .12em; padding-left: .12em; line-height: 1.1; }
[data-theme=a] #call .en { font: italic 500 56px "Cormorant Garamond", serif; margin-top: 6px; color: #d9ceb9; }
[data-theme=a] #call .sub { font-size: 30px; margin-top: 14px; color: #b9ae9c; }
[data-theme=a] [data-loser="1"] #call { translate: -400px 0; }
[data-theme=a] [data-loser="0"] #call { translate: 400px 0; }
[data-theme=a] #title { top: 132px; z-index: 8; }
[data-theme=a] #title .zh { font-weight: 900; font-size: 128px; letter-spacing: .14em; padding-left: .14em; line-height: 1.1; }
[data-theme=a] #title .en { font: italic 500 46px "Cormorant Garamond", serif; color: #d9ceb9; }
[data-theme=a] .dmg { font: italic 500 110px "Cormorant Garamond", serif; color: var(--fg); }
[data-theme=a] .burst { background: #fff; }
[data-theme=a] .pick { bottom: 100px; }
[data-theme=a] #dock { bottom: 112px; }

/* ---------- b 拳赛海报: a two-colour fight bill ---------- */
[data-theme=b] { --bg: #efe6d2; --fg: #1f2a5a; --flash: #e4412a; --floor: 164px; --h: 590px; --x0: 530px; --x1: 1390px; }
[data-theme=b] #stage { font-family: "ZCOOL QingKe HuangYou", var(--ui); }
[data-theme=b] #flash { mix-blend-mode: multiply; }
.b .tex { position: absolute; inset: 0; z-index: 12; pointer-events: none; mix-blend-mode: multiply; opacity: .4; }
.b .disc { top: 210px; width: 760px; height: 760px; margin-left: -380px; border-radius: 50%; }
.b .disc.s0 { left: var(--x0); background: #e4412a; mix-blend-mode: multiply; opacity: .9; }
.b .disc.s1 { left: var(--x1); background: #1f2a5a; opacity: .92; }
.b .dots { top: 186px; width: 800px; height: 800px; margin-left: -372px; background-image: radial-gradient(circle, var(--c) 36%, transparent 38%); background-size: 17px 17px;
  -webkit-mask: radial-gradient(circle, transparent 40%, #000 70%, transparent 71%); mask: radial-gradient(circle, transparent 40%, #000 70%, transparent 71%); }
.b .dots.s0 { left: var(--x0); --c: #1f2a5a; }
.b .dots.s1 { left: var(--x1); --c: #e4412a; }
.b .foot { left: 0; right: 0; bottom: 0; height: 128px; background: #1f2a5a; z-index: 9; color: #efe6d2; font-style: normal; font-size: 44px; display: flex; align-items: center; padding: 0 64px; }
[data-theme=b] .fighter { filter: drop-shadow(16px 14px 0 rgba(31, 42, 90, .92)); }
[data-theme=b] .side { top: 34px; display: grid; grid-template-columns: auto auto; column-gap: 20px; align-items: start; }
[data-theme=b] .side.p0 { left: 64px; }
[data-theme=b] .side.p1 { right: 64px; direction: rtl; }
[data-theme=b] .num { grid-row: 1 / 4; font: 400 196px/1 Anton, sans-serif; direction: ltr; color: #e4412a; }
[data-theme=b] .side.p1 .num { color: #1f2a5a; }
[data-theme=b] .who { font-size: 64px; line-height: 1; margin-top: 18px; }
[data-theme=b] .meta { font-size: 28px; margin-top: 6px; direction: ltr; }
[data-theme=b] .role { font-size: 34px; color: #e4412a; margin-top: 4px; }
[data-theme=b] .bar { display: none; }
[data-theme=b] .mid { top: 38px; left: 0; right: 0; text-align: center; }
[data-theme=b] .title { font-size: 104px; line-height: 1; letter-spacing: .02em; text-shadow: 6px 5px 0 #e4412a; }
[data-theme=b] .round, [data-theme=b] .clock { display: inline-block; font: 400 34px Anton, "ZCOOL QingKe HuangYou", sans-serif; letter-spacing: .1em; margin: 12px 8px 0; }
[data-theme=b] .urgent .clock { color: #e4412a; }
[data-theme=b] #sensor { right: 64px; bottom: 0; height: 128px; display: flex; align-items: center; color: #efe6d2; font: 400 34px Anton, "ZCOOL QingKe HuangYou", sans-serif; letter-spacing: .06em; }
[data-theme=b] #call { top: 300px; z-index: 8; rotate: -7deg; }
[data-theme=b] #call .zh { font-size: min(330px, calc(1500px / var(--n, 2))); line-height: 1; color: #e4412a; text-shadow: 12px 10px 0 #1f2a5a; }
[data-theme=b] #call .en { display: none; }
[data-theme=b] #call .sub { font-size: 44px; margin-top: 10px; color: #1f2a5a; }
[data-theme=b] [data-beat=over] #call { top: 660px; rotate: -3deg; }
[data-theme=b] [data-beat=over] #call .zh { font-size: 240px; }
[data-theme=b] #title { display: none; }
[data-theme=b] .dmg { font: 400 150px Anton, sans-serif; color: #e4412a; text-shadow: 7px 6px 0 #1f2a5a; }
[data-theme=b] .burst { background: #e4412a; }
[data-theme=b] .pick { bottom: 132px; }
[data-theme=b] .pick button.on { border-bottom-color: #e4412a; }

/* ---------- c 玩具展台: one colour per event, the type stands behind the toys ---------- */
[data-theme=c] { --bg: #1b3fe0; --fg: #fff; --flash: #f6c933; --floor: 176px; --h: 620px; --x0: 400px; --x1: 1500px; }
[data-theme=c] #stage { font-family: "Noto Sans SC", var(--ui); transition: background .1s; }
[data-theme=c] [data-beat=armed] { --bg: #142fa8; }
[data-theme=c] [data-beat=hit] { --bg: #ff4a1c; }

[data-theme=c] [data-beat=over] { --bg: #f4efe4; --fg: #101522; }
[data-theme=c] [data-beat=over], [data-theme=c] .waiting { --h: 430px; --floor: 150px; }
.c .cyc { left: -60px; right: -60px; bottom: -40px; height: 330px; border-radius: 50% 50% 0 0 / 70px; background: color-mix(in oklch, var(--bg) 84%, #000); transition: background .1s; }
.c .shadow { bottom: 130px; width: 540px; height: 80px; margin-left: -270px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, .5), transparent); }
.c .s0 { left: var(--x0); }
.c .s1 { left: var(--x1); }
[data-beat=over] .c .shadow, .waiting .c .shadow { width: 400px; margin-left: -200px; }
[data-theme=c] .side { top: 44px; width: 860px; border-top: 3px solid var(--fg); padding-top: 16px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; }
[data-theme=c] .side.p0 { left: 64px; }
[data-theme=c] .side.p1 { right: 64px; direction: rtl; }
[data-theme=c] .who { grid-column: 1; font-weight: 900; font-size: 44px; line-height: 1.2; }
[data-theme=c] .meta { grid-column: 1; font-size: 25px; font-weight: 500; direction: ltr; text-align: start; }
[data-theme=c] .side.p1 .meta { text-align: end; }
[data-theme=c] .role { grid-column: 1; font-size: 28px; font-weight: 900; }
[data-theme=c] .num { grid-column: 2; grid-row: 1 / 3; font: 800 112px/1 Archivo, sans-serif; font-stretch: 125%; letter-spacing: -.03em; direction: ltr; text-align: start; }
[data-theme=c] .side.p1 .num { text-align: end; }
[data-theme=c] .bar { display: none; }
[data-theme=c] .ticks { grid-column: 2; display: flex; gap: 6px; margin-top: 8px; }
[data-theme=c] .ticks b { flex: 1; height: 14px; background: var(--fg); transition: opacity .3s; }
[data-theme=c] .ticks b.off { opacity: .18; }
[data-theme=c] .mid { top: 62px; left: 0; right: 0; text-align: center; }
[data-theme=c] .title { display: none; }
[data-theme=c] .round { font-size: 28px; font-weight: 500; }
[data-theme=c] .clock { font: 800 60px/1.2 Archivo, sans-serif; font-stretch: 125%; }
[data-theme=c] .urgent .clock { color: #ffd23f; }
[data-theme=c] #sensor { left: 0; right: 0; bottom: 40px; display: flex; justify-content: center; font-weight: 500; font-size: 30px; }
[data-theme=c] #call { top: 220px; z-index: 2; }
[data-theme=c] #call .zh { font-weight: 900; font-size: min(520px, calc(1760px / var(--n, 2))); line-height: 1; letter-spacing: -.04em; }
[data-theme=c] #call .en { display: none; }
[data-theme=c] #call .sub { font-size: 40px; font-weight: 900; margin-top: 10px; }
[data-theme=c] [data-beat=over] #call { top: 205px; }
[data-theme=c] #title { top: 215px; z-index: 2; }
[data-theme=c] #title .zh { font-weight: 900; font-size: 352px; line-height: 1; letter-spacing: -.04em; }
[data-theme=c] #dock { bottom: 96px; }
[data-theme=c] #title .en { display: none; }
[data-theme=c] .dmg { font: 800 130px Archivo, sans-serif; font-stretch: 125%; color: var(--fg); }
[data-theme=c] .burst { background: #fff; }
[data-theme=c] .pick { bottom: 86px; }

@media (prefers-reduced-motion: reduce) { .fighter .body { animation: none; } }
</style>
</head>
<body>
<div id="view"><div id="fit"><div id="stage" data-beat="ready" class="">
  <div class="set a"><i class="spot s0"></i><i class="spot s1"></i><i class="pool s0"></i><i class="pool s1"></i><i class="lb t"></i><i class="lb b"></i></div>
  <div class="set b"><i class="disc s0"></i><i class="disc s1"></i><i class="dots s0"></i><i class="dots s1"></i><i class="foot">空气巴掌对决</i>
    <svg class="tex" width="1920" height="1080" aria-hidden="true"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2"/><feColorMatrix values="0 0 0 0 .4 0 0 0 0 .34 0 0 0 0 .24 0 0 0 .55 0"/></filter><rect width="1920" height="1080" filter="url(#grain)"/></svg></div>

  <div class="fighter p0" id="f0"><div class="body"></div></div>
  <div class="fighter p1" id="f1"><div class="body"></div></div>

  <div id="hud">
    <div class="side p0"><span class="num" id="num0">100</span><span class="who" id="name0"></span><span class="meta"><span id="dev0">SLAP-P1</span> · <span class="link off" id="link0">未连接</span></span><span class="role" id="role0"></span><span class="bar" id="bar0"><i></i></span><span class="ticks" id="ticks0"></span></div>
    <div class="side p1"><span class="num" id="num1">100</span><span class="who" id="name1"></span><span class="meta"><span id="dev1">SLAP-P2</span> · <span class="link off" id="link1">未连接</span></span><span class="role" id="role1"></span><span class="bar" id="bar1"><i></i></span><span class="ticks" id="ticks1"></span></div>

      <button data-cmd="start">开局<kbd>空格</kbd></button><button data-cmd="reset">重置<kbd>R</kbd></button><button id="themebtn">风格<kbd>T</kbd></button><button id="mute">音效<kbd>M</kbd></button><button id="fs">全屏<kbd>F</kbd></button>

<script>
"use strict";
// Must match firmware/libraries/SlapCommon/src/slap_game_config.h
const ATTACK_TIMEOUT_MS = 5000;

const $ = (id) => document.getElementById(id);
const stage = $("stage");
// The family, as lined up in 奶史_'s group shot. size: how big they stand next to each other.
const CHARS = [
  { id: "naiwa",  name: "奶蛙", size: 1 },
  { id: "naicha", name: "奶茶", size: .8 },
  { id: "naigou", name: "奶狗", size: .82 },

// Share of the character height per pose: the cutouts are cropped to their outline.
const POSE_SIZE = { idle: 1, windup: .98, slap: .84, hit: .9, block: .8, dodge: .88, dizzy: .96, laugh: .96, laugh2: .82, win: 1.04 };
const FALLBACK = { hit: ["hit", "laugh"], laugh: ["laugh"], laugh2: ["laugh2", "laugh"], windup: ["windup"], slap: ["slap", "windup"],
                   block: ["block"], dodge: ["dodge"], dizzy: ["dizzy", "hit"], win: ["win"], idle: [] };
const CLS = { forehand: "正手", backhand: "反手", feint: "假动作", dodge_left: "左闪", dodge_right: "右闪", block: "格挡", background: "背景" };
// beat colours the backdrop in direction c: hit = it landed, safe = it was stopped, dull = nothing happened
const OUTCOME = {

const STRENGTH = { light: 0.55, medium: 0.8, heavy: 1.15 };
const STRENGTH_ZH = { light: "轻", medium: "", heavy: "痛击" };
// Keyboard play (web_dashboard.py --keys). Right-handed: a forehand is dodged to the right.
const KEYMAP = {
  KeyA: [0, "forehand"], KeyD: [0, "backhand"], KeyW: [0, "feint"], KeyQ: [0, "dodge_left"], KeyE: [0, "dodge_right"], KeyS: [0, "block"],
  KeyJ: [1, "forehand"], KeyL: [1, "backhand"], KeyI: [1, "feint"], KeyU: [1, "dodge_left"], KeyO: [1, "dodge_right"], KeyK: [1, "block"],

const S = { hp: [100, 100], round: 0, attacker: 0, state: "IDLE", deadline: 0, judging: false, over: false, mode: "referee", startedAt: 0, winner: null };

/* ---------------- theme + stage ---------------- */
const THEMES = { a: "午夜决斗", b: "拳赛海报", c: "玩具展台" };
function setTheme(t, quiet) {

  try { localStorage.setItem("slap.theme", t); } catch (e) {}

}
function nextTheme() { const k = Object.keys(THEMES); setTheme(k[(k.indexOf(document.documentElement.dataset.theme) + 1) % k.length]); }
function fitStage() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);

  $("fit").style.width = 1920 * s + "px"; $("fit").style.height = 1080 * s + "px";
}
addEventListener("resize", fitStage);
const cssPx = (name) => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));

let mouseH;
addEventListener("mousemove", () => { stage.classList.add("mouse"); clearTimeout(mouseH); mouseH = setTimeout(() => stage.classList.remove("mouse"), 2600); });
const playing = () => S.state !== "IDLE" && !S.over;

/* ---------------- fighters ---------------- */
let MAN = {};                                   // chars/manifest.json: id -> pose -> [w, h]
const roster = () => CHARS.filter(c => MAN[c.id] && MAN[c.id].idle);
function loadPick() {
  const ids = roster().map(c => c.id);
  try { const p = JSON.parse(localStorage.getItem("slap.fighters")); if (p && ids.includes(p[0]) && ids.includes(p[1]) && p[0] !== p[1]) return p; } catch (e) {}
  return ids.slice(0, 2);
}
let PICK = [];
const who = (i) => CHARS.find(c => c.id === PICK[i]);
const nm = (i) => who(i).name;
const poseSrc = (c, p) => `/chars/${c.id}/${p}.webp`;
function poseOf(i, p) {
  const have = MAN[PICK[i]] || {};
  for (const q of FALLBACK[p] || []) if (have[q]) return q;
  return "idle";
}
function setPose(i, p) {
  const q = poseOf(i, p), f = $("f" + i);
  if (f.dataset.pose === q) return;
  f.dataset.pose = q;
  f.querySelectorAll("img").forEach(m => m.classList.toggle("on", m.dataset.pose === q));
  f.querySelector(".body").animate([{ transform: "scale(1.03, .96)" }, { transform: "none" }], { duration: 130, easing: "ease-out" });
}
// What a fighter falls back to when an action ends.
function rest(i) {
  if (S.over) return i === S.winner ? "win" : "laugh";
  return S.state === "ARMED" && i === S.attacker ? "windup" : "idle";
}
function holdPose(i, p, ms, after) {
  const f = $("f" + i);
  clearTimeout(f.poseH); setPose(i, p);
  f.poseH = setTimeout(() => { if (after) after(); else setPose(i, rest(i)); }, ms);
}
function buildFighter(i) {
  const c = who(i), f = $("f" + i), poses = Object.keys(MAN[c.id]);
  f.querySelector(".body").innerHTML = poses.map(p => `<img data-pose="${p}" src="${poseSrc(c, p)}" alt="" draggable="false" style="--k:${(POSE_SIZE[p] || 1) * c.size}">`).join("");
  delete f.dataset.pose;
  setPose(i, rest(i));
  $("name" + i).textContent = c.name;
  const leg = document.querySelector("#keys .who" + i); if (leg) leg.textContent = c.name;
  buildPicks();
}
function buildPicks() {
  for (const i of [0, 1]) {
    const box = $("pick" + i); box.innerHTML = "";
    for (const c of roster()) {
      if (c.id === PICK[i ^ 1]) continue;
      const b = document.createElement("button");
      b.className = c.id === PICK[i] ? "on" : ""; b.title = c.name;
      b.innerHTML = `<img src="${poseSrc(c, "idle")}" alt="${c.name}" draggable="false">`;
      b.addEventListener("click", () => choose(i, c.id));
      box.appendChild(b);
    }
  }
}
function choose(i, id) {
  if (playing()) { toast("比赛中不能换角色"); return; }
  PICK[i] = id;
  try { localStorage.setItem("slap.fighters", JSON.stringify(PICK)); } catch (e) {}
  buildFighter(i); buildFighter(i ^ 1);
  Sfx.boing();
}
function cycle(i) {
  const ids = roster().map(c => c.id).filter(id => id !== PICK[i ^ 1]);
  if (ids.length) choose(i, ids[(ids.indexOf(PICK[i]) + 1) % ids.length]);
}
// Signature move: 捧腹大笑. ms = 0 laughs until the board is reset, alternating the two laugh poses.
function laugh(i, ms = 0) {
  const f = $("f" + i);
  clearTimeout(f.poseH); clearInterval(f.lolH);
  setPose(i, "laugh");
  if (ms) { f.poseH = setTimeout(() => setPose(i, rest(i)), ms); return; }
  f.classList.add("lol");
  let two = false;
  f.lolH = setInterval(() => { two = !two; setPose(i, two ? "laugh2" : "laugh"); }, 620);
}
function stopLaugh(i) { const f = $("f" + i); clearInterval(f.lolH); clearTimeout(f.poseH); f.classList.remove("lol"); }

/* ---------------- sound (synthesised, no files) ---------------- */
const Sfx = {
  ctx: null, muted: false,
  wake() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
    if (this.ctx.state === "suspended") this.ctx.resume();
  },
  ok() { return this.ctx && !this.muted && this.ctx.state === "running"; },
  gain(t, peak, dur) {
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(this.ctx.destination); return g;
  },
  noise(dur) {
    const c = this.ctx, n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = b; return s;
  },
  slap(k = 1) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime, n = this.noise(0.25), f = c.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = 1700; f.Q.value = 0.7; n.connect(f); f.connect(this.gain(t, 0.95 * k, 0.15)); n.start(t);
    const o = c.createOscillator(); o.type = "sine"; o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.18);
    o.connect(this.gain(t, 0.6 * k, 0.2)); o.start(t); o.stop(t + 0.25);
  },
  boing() {   // jelly body squash
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime, o = c.createOscillator();
    o.type = "sine"; o.frequency.setValueAtTime(320, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.25);
    o.connect(this.gain(t, 0.25, 0.3)); o.start(t); o.stop(t + 0.32);
  },
  whoosh(v = 0.3) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime, n = this.noise(0.4), f = c.createBiquadFilter();
    f.type = "bandpass"; f.Q.value = 1.6; f.frequency.setValueAtTime(350, t); f.frequency.exponentialRampToValueAtTime(2600, t + 0.28);
    n.connect(f); f.connect(this.gain(t, v, 0.3)); n.start(t);
  },
  ding(fr = 1046, when = 0, vol = 0.14) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + when, o = c.createOscillator();
    o.type = "triangle"; o.frequency.value = fr; o.connect(this.gain(t, vol, 0.5)); o.start(t); o.stop(t + 0.55);
  },
  laugh(len = 2.2) {   // "哈哈哈" — breathy bursts riding a falling pitch
    if (!this.ok()) return;
    const c = this.ctx, t0 = c.currentTime;
    for (let k = 0, t = t0; t < t0 + len; k++, t += 0.13 + Math.random() * 0.03) {
      const o = c.createOscillator(), f = c.createBiquadFilter(), n = this.noise(0.12), nf = c.createBiquadFilter();
      const p = 330 - k * 6 + Math.random() * 30;
      o.type = "sawtooth"; o.frequency.setValueAtTime(p * 1.15, t); o.frequency.exponentialRampToValueAtTime(p, t + 0.09);
      f.type = "bandpass"; f.frequency.value = 900; f.Q.value = 3;
      o.connect(f); f.connect(this.gain(t, 0.22, 0.11)); o.start(t); o.stop(t + 0.12);
      nf.type = "bandpass"; nf.frequency.value = 2400; n.connect(nf); nf.connect(this.gain(t, 0.12, 0.08)); n.start(t);
    }
  },
};

/* ---------------- helpers ---------------- */
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2200); }
function playerOf(name) { return /P2|DEF/.test(name) ? 1 : 0; }
const toward = (i) => (i ? -1 : 1);
const fighterX = (i) => cssPx(i ? "--x1" : "--x0");

// The backdrop state. It decays to the base beat of the round (direction c reads it as colour).
function baseBeat() { return S.over ? "over" : S.state === "ARMED" ? "armed" : "ready"; }
function beat(b, ms) {
  stage.dataset.beat = b; clearTimeout(beat.h);
  if (ms) beat.h = setTimeout(() => { stage.dataset.beat = baseBeat(); }, ms);
}
function call(zh, en = "", sub = "", hold = 1300) {
  const a = $("call");
  a.innerHTML = ""; a.style.setProperty("--n", [...zh].length); a.style.opacity = 1;
  for (const [cls, t] of [["zh", zh], ["en", en], ["sub", sub]]) {
    if (!t) continue;
    const s = document.createElement("span"); s.className = cls; s.textContent = t; a.appendChild(s);
  }
  a.firstChild.animate([{ transform: "scale(.72)", opacity: 0 }, { transform: "scale(1.04)", opacity: 1, offset: .55 }, { transform: "scale(1)", opacity: 1 }],
    { duration: 240, easing: "cubic-bezier(.2,1.4,.4,1)" });
  clearTimeout(call.h);
  if (hold) call.h = setTimeout(() => a.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, fill: "forwards" }).onfinish = (e) => { a.innerHTML = ""; e.target.cancel(); }, hold);
}
function setHp(hp, animate = true) {
  hp.forEach((v, i) => {
    const b = $("bar" + i), val = Math.max(0, v);
    if (!animate) b.firstChild.style.transition = "none";
    $("num" + i).textContent = val; b.style.setProperty("--v", val + "%");
    if (!animate) { void b.offsetWidth; b.firstChild.style.transition = ""; }
    $("ticks" + i).innerHTML = Array.from({ length: 10 }, (_, n) => `<b class="${n < Math.ceil(val / 10) ? "" : "off"}"></b>`).join("");
  });
  S.hp = hp.slice();
}
function setRoles() {
  const show = !S.over && S.state !== "IDLE" && S.round > 0;
  for (const i of [0, 1]) { const r = $("role" + i); r.textContent = i === S.attacker ? "出手" : "防守"; r.classList.toggle("show", show); }
  stage.dataset.atk = show ? S.attacker : "";
}
function shake(k) {
  const px = 5 + 20 * k;
  stage.animate([{ translate: "0 0" }, { translate: `${-px}px ${px * .4}px` }, { translate: `${px * .75}px ${-px * .4}px` }, { translate: `${-px * .4}px ${px * .25}px` }, { translate: "0 0" }],
    { duration: 240 + 160 * k, easing: "ease-out" });
}
function flash(v = 1) { $("flash").animate([{ opacity: v }, { opacity: v, offset: .3 }, { opacity: 0 }], { duration: 170 }); }
function popDamage(i, dmg) {
  if (!dmg) return;
  const d = document.createElement("div");
  d.className = "dmg"; d.textContent = `−${dmg}`;
  d.style.left = fighterX(i) + toward(i) * -150 + "px"; d.style.top = 1080 - cssPx("--floor") - cssPx("--h") * .95 + "px";
  stage.appendChild(d);
  d.animate([{ translate: "0 20px", scale: .6, opacity: 0 }, { translate: "0 0", scale: 1.08, opacity: 1, offset: .14 }, { translate: "0 -14px", scale: 1, opacity: 1, offset: .75 }, { translate: "0 -60px", scale: 1, opacity: 0 }],
    { duration: 1250, easing: "ease-out" }).onfinish = () => d.remove();
}
function burstAt(i, k) {
  const b = $("burst"), s = .55 + .55 * k;
  b.style.left = fighterX(i) - toward(i) * 60 + "px"; b.style.top = 1080 - cssPx("--floor") - cssPx("--h") * .62 + "px";
  b.animate([{ opacity: 1, transform: `scale(${s * .6}) rotate(0deg)` }, { opacity: 1, transform: `scale(${s}) rotate(8deg)`, offset: .45 }, { opacity: 0, transform: `scale(${s * 1.15}) rotate(10deg)` }], { duration: 230 });
}

/* ---------------- moves ---------------- */
// The attacker crosses the stage and hangs on the frame of contact. Returns ms to contact.
function swing(from, connects = true) {
  const f = $("f" + from), reach = (fighterX(1) - fighterX(0)) - cssPx("--h") * .72;
  clearTimeout(f.poseH); setPose(from, "slap");
  const dx = toward(from) * (connects ? reach : reach * 1.08);
  f.animate([{ transform: "none" }, { transform: `translateX(${-dx * .05}px)`, offset: .16 }, { transform: `translateX(${dx}px)`, offset: .3 },
    { transform: `translateX(${dx}px)`, offset: .56 }, { transform: "none" }], { duration: 640, easing: "cubic-bezier(.4,0,.2,1)" })
    .onfinish = () => setPose(from, rest(from));
  return 190;
}
function recoil(i, k) {
  const f = $("f" + i), d = -toward(i);
  f.animate([{ transform: "none" }, { transform: `translateX(${d * 90 * k}px) rotate(${d * 7 * k}deg)`, offset: .1 }, { transform: `translateX(${d * 130 * k}px) rotate(${d * 9 * k}deg)`, offset: .55 }, { transform: "none" }],
    { duration: 780 + 320 * k, easing: "cubic-bezier(.15,.8,.25,1)" });
}
function impact(def, k, crit) {   // a slap that lands cracks the fighter up for a moment (绷住值 drops)
  stopLaugh(def);
  holdPose(def, "hit", 620 + 260 * k, () => laugh(def, 420 + 420 * k));
  recoil(def, k); burstAt(def, k); shake(k); Sfx.slap(k); Sfx.boing();
  if (k >= 1 || crit) flash();
}
function dodge(i) {   // always away from the slap: on screen, left and right dodges read the same
  const f = $("f" + i), d = -toward(i);
  holdPose(i, "dodge", 720);
  f.animate([{ transform: "none" }, { transform: `translateX(${d * 170}px)`, offset: .2 }, { transform: `translateX(${d * 150}px)`, offset: .62 }, { transform: "none" }],
    { duration: 720, easing: "cubic-bezier(.2,.9,.3,1)" });
}
function guard(i) {
  holdPose(i, "block", 820);
  $("f" + i).animate([{ transform: "none" }, { transform: `translateX(${-toward(i) * 36}px)`, offset: .2 }, { transform: "none" }], { duration: 480, easing: "ease-out" });
}
function daze(i) {
  holdPose(i, "dizzy", 1300);
  $("f" + i).animate([{ transform: "none" }, { transform: "rotate(-5deg)" }, { transform: "rotate(5deg)" }, { transform: "rotate(-3deg)" }, { transform: "none" }], { duration: 1000 });
}

/* ---------------- referee messages ---------------- */
function onResult(m, animate) {
  const atk = m.attacker, def = atk ^ 1, k = STRENGTH[m.strength] || 0.8;
  const o = OUTCOME[m.outcome] || { zh: m.outcome, en: "", beat: "dull" };
  if (!animate) { setHp(m.hp, false); return; }
  const delta = m.delta_ms ? `反应 ${m.delta_ms} ms` : "";
  const land = (t, target, kk, crit, dmg) => setTimeout(() => {
    impact(target, kk, crit); setHp(m.hp); popDamage(target, dmg); beat(o.beat, 1300);
  }, t);
  switch (m.outcome) {
    case "HIT": case "JUMPED": {
      const heavy = m.strength === "heavy" && m.outcome === "HIT";
      land(swing(atk), def, k, false, m.damage);
      call(heavy ? "痛击" : (STRENGTH_ZH[m.strength] === "轻" && m.outcome === "HIT" ? "轻轻一下" : o.zh), heavy ? "A heavy blow." : o.en, m.outcome === "JUMPED" ? `${nm(def)}动得太早，照吃` : delta);
      break;
    }
    case "FEINT_PUNISHED":
      land(swing(atk), def, 1.2, true, m.damage);
      call(o.zh, o.en, `${nm(def)}信了假动作`);
      break;
    case "GRAZE":
      dodge(def);
      land(swing(atk), def, 0.4, false, m.damage);
      call(o.zh, o.en, "闪反方向了，扣一半");
      break;
    case "BLOCKED":
      setTimeout(() => { guard(def); Sfx.slap(0.35); shake(0.25); setHp(m.hp); popDamage(def, m.damage); beat(o.beat, 1100); }, swing(atk));
      call(o.zh, o.en, "伤害减半，不能反击");
      break;
    case "MISS":
      dodge(def); swing(atk, false); Sfx.whoosh(); beat(o.beat, 1100);
      call(o.zh, o.en, delta ? `${delta}，可以反击` : "");
      break;
    case "COUNTERED":
      dodge(def); swing(atk, false); Sfx.whoosh();
      setTimeout(() => land(swing(def), atk, 1.1, true, m.counter_damage), 640);
      call(o.zh, o.en, `${nm(def)}闪开后反手一巴掌`, 1700);
      break;
    case "FEINT_FOOLED": case "FEINT_HELD":
      daze(def); setHp(m.hp); Sfx.whoosh(0.15); beat(o.beat, 1100);
      call(o.zh, o.en, m.outcome === "FEINT_FOOLED" ? "下回合防守时间变短" : "");
      break;
    default:
      setHp(m.hp); Sfx.ding(392, 0, 0.12); Sfx.ding(330, 0.14, 0.12); beat(o.beat, 1100); call(o.zh, o.en, "换人");
  }
}

function onGameOver(m, animate) {
  S.over = true; S.winner = m.winner;
  setHp(m.hp, animate);
  const loser = m.winner ^ 1, secs = S.startedAt ? Math.round((performance.now() - S.startedAt) / 1000) : null;
  const show = () => {
    beat("over"); stage.dataset.loser = loser;
    laugh(loser); clearTimeout($("f" + m.winner).poseH); setPose(m.winner, "win");
    call("绷不住了", "Composure, lost.", "", 0);
    $("sensor").textContent = secs != null ? `${nm(m.winner)}在绷不住大赛中坚持了 ${secs} 秒 · 按空格再来一局` : `${nm(m.winner)}绷住了，${nm(loser)}没绷住`;
    if (animate) { flash(); shake(1.1); Sfx.laugh(2.6); }
    setRoles(); syncPlaying();
  };
  if (animate) setTimeout(show, 1000); else show();
}

function resetBoard() {
  S.over = false; S.round = 0; S.deadline = 0; S.winner = null;
  $("call").innerHTML = ""; clearTimeout(call.h);
  delete stage.dataset.loser;
  for (const i of [0, 1]) { stopLaugh(i); setPose(i, "idle"); }
  setHp([100, 100], false); beat("ready");
}
function idleLine() { $("sensor").textContent = "按空格开局 · 1 / 2 换角色 · T 换风格" + (S.mode === "keys" ? " · 两人一台键盘" : ""); }
function syncPlaying() {
  const waiting = S.state === "IDLE" && !S.over;
  stage.classList.toggle("waiting", waiting);
  $("title").classList.toggle("hidden", !waiting);
}

function handle(m, animate = true) {
  switch (m.type) {
    case "peer": {
      const i = playerOf(m.name), link = $("link" + i), was = !link.classList.contains("off");
      link.classList.toggle("off", !m.connected); link.textContent = m.connected ? "已连接" : "未连接";
      $("dev" + i).textContent = m.name;
      if (animate && was !== !!m.connected) toast(`${nm(i)}${m.connected ? "连上了" : "掉线了"}（${m.name}）`);
      break;
    }
    case "state":
      S.state = m.state;
      if (m.state === "IDLE") { resetBoard(); idleLine(); }
      if (m.state === "ARMED" && !S.deadline) S.deadline = performance.now() + ATTACK_TIMEOUT_MS;
      S.judging = m.state === "JUDGING";
      if (m.state !== "ARMED" && m.state !== "JUDGING") S.deadline = 0;
      if (!S.over && m.state === "ARMED") setPose(S.attacker, "windup");
      if (["ready", "armed"].includes(stage.dataset.beat)) stage.dataset.beat = baseBeat();
      setRoles(); syncPlaying();
      break;
    case "announce":
      if (m.round === 1) { resetBoard(); S.startedAt = performance.now(); }
      S.round = m.round; S.attacker = m.attacker; S.deadline = 0;
      setRoles(); syncPlaying();
      $("sensor").textContent = "";
      if (animate) {
        call(`第 ${m.round} 回合`, `Round ${m.round}`, `${nm(m.attacker)}出手`, 1000);
        Sfx.ding(m.round === 1 ? 784 : 880); if (m.round === 1) Sfx.ding(1046, .12);
      }
      break;
    case "result": onResult(m, animate); break;
    case "game_over": onGameOver(m, animate); break;
    case "event": if (animate) addEvent(m); break;
    case "snapshot":
      setMode(m.mode || "referee");
      for (const x of m.items) handle(x, false);
      break;
  }
}

// Every event the boards detect is shown as it came in: this line is the on-device inference, in the open.
function addEvent(m) {
  const i = playerOf(m.from);
  if (!S.over) $("sensor").textContent = `${nm(i)} · ${CLS[m.cls] || m.cls} ${Math.round((m.conf / 255) * 100)}% · ${m.peak}°/s · 延迟 ${m.rx - m.t} ms`;
  if (m.cls === "forehand" || m.cls === "backhand" || m.cls === "feint") Sfx.whoosh(0.12);
}

/* ---------------- round clock ---------------- */
function tick() {
  const mid = $("mid"), r = $("round"), c = $("clock");
  if (S.deadline) {
    const left = Math.max(0, S.deadline - performance.now());
    mid.classList.toggle("urgent", left < 1500 && !S.judging);
    r.textContent = S.judging ? `第 ${S.round} 回合 · 判定中` : `第 ${S.round} 回合 · ${nm(S.attacker)}出手`;
    c.textContent = S.judging ? "" : (left / 1000).toFixed(1);
  } else {
    mid.classList.remove("urgent"); c.textContent = "";
    r.textContent = S.over ? "本场结束" : S.state === "IDLE" ? "等待开局" : S.round ? `第 ${S.round} 回合` : "准备";
  }
  requestAnimationFrame(tick);
}

/* ---------------- keyboard play ---------------- */
function setMode(mode) { S.mode = mode; $("keys").classList.toggle("hidden", mode !== "keys"); if (S.state === "IDLE") idleLine(); }
function buildLegend() {
  const label = { feint: "假动作", forehand: "正手", backhand: "反手", dodge_left: "左闪", block: "格挡", dodge_right: "右闪" };
  const box = $("keys");
  for (const i of [0, 1]) {
    const w = document.createElement("b"); w.className = "who" + i; box.appendChild(w);
    for (const cls of ["feint", "forehand", "backhand", "dodge_left", "block", "dodge_right"]) {
      const code = Object.keys(KEYMAP).find(c => KEYMAP[c][0] === i && KEYMAP[c][1] === cls);
      const d = document.createElement("span"); d.className = "k"; d.id = "k-" + code;
      d.innerHTML = `<kbd>${code.slice(3)}</kbd>${label[cls]}`; box.appendChild(d);
    }
  }
  const h = document.createElement("span"); h.className = "hint"; h.textContent = "按住 Shift 痛击，Alt 轻打；正手往右闪，反手往左闪；比赛中按 H 看按键"; box.appendChild(h);
}
function keyAction(e) {
  const k = KEYMAP[e.code];
  if (!k || S.mode !== "keys") return false;
  const [p, cls] = k, peak = e.shiftKey ? 900 : e.altKey ? 250 : 550;   // PEAK_*_DPS tiers: heavy / light / medium
  send(`ev ${p} ${cls} ${peak}`, true);
  const cap = $("k-" + e.code); if (cap) { cap.classList.add("hit"); setTimeout(() => cap.classList.remove("hit"), 160); }
  return true;
}

/* ---------------- commands ---------------- */
async function send(cmd, quiet = false) {
  Sfx.wake();
  try {
    const r = await fetch("/cmd", { method: "POST", body: cmd });
    if (r.status === 409 && !quiet) toast("这个数据来源不接受指令（stdin / 回放）");
  } catch (e) { if (!quiet) toast("指令没送出去：web_dashboard.py 有在跑吗？"); }
}
document.querySelectorAll("[data-cmd]").forEach(b => b.addEventListener("click", () => send(b.dataset.cmd)));
function toggleMute() { Sfx.wake(); Sfx.muted = !Sfx.muted; $("mute").classList.toggle("off", Sfx.muted); }
function toggleFs() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
$("mute").addEventListener("click", toggleMute);
$("fs").addEventListener("click", toggleFs);
$("themebtn").addEventListener("click", nextTheme);
document.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (keyAction(e)) { e.preventDefault(); return; }
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); send("start"); }
  else if (e.code === "Digit1" || e.code === "Digit2") cycle(e.code === "Digit1" ? 0 : 1);
  else if (e.code === "KeyR") send("reset");
  else if (e.code === "KeyT") nextTheme();
  else if (e.code === "KeyH") stage.classList.toggle("legend");
  else if (e.code === "KeyM") toggleMute();
  else if (e.code === "KeyF") toggleFs();
});
document.addEventListener("keyup", (e) => { if (e.key === "Alt") e.preventDefault(); });   // keep Alt from opening the browser menu
document.addEventListener("pointerdown", () => Sfx.wake(), { once: true });

/* ---------------- stream ---------------- */
function connect() {
  const es = new EventSource("/events");
  es.onopen = () => $("offline").classList.add("hidden");
  es.onmessage = (ev) => { try { handle(JSON.parse(ev.data)); } catch (err) { console.error(err, ev.data); } };
  es.onerror = () => $("offline").classList.remove("hidden");
}
async function boot() {
  let theme = "c";
  try { theme = localStorage.getItem("slap.theme") || "c"; } catch (e) {}
  setTheme(THEMES[theme] ? theme : "c", true);
  fitStage(); buildLegend();
  MAN = await (await fetch("/chars/manifest.json")).json();
  PICK = loadPick();
  for (const i of [0, 1]) buildFighter(i);
  setHp([100, 100], false); idleLine(); syncPlaying();
  requestAnimationFrame(tick);
  connect();
}
boot();
</script>
</body>
